<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Drippy | Fonger</title>
  <link rel="stylesheet" href="style.css">
  <link rel="expect" href="#mark" blocking="render">
  <script src="transition.js"></script>
  <style>
    /* Úhel pro točící se rámečky v tabuli */
    @property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
    @keyframes spin { to { --ang: 360deg; } }

    /* Barvy pruhů nad a pod hřištěm v celoobrazovkovém režimu (mění se podle úrovně) */
    @property --bar-top { syntax: '<color>'; inherits: true; initial-value: #060c1f; }
    @property --bar-bot { syntax: '<color>'; inherits: true; initial-value: #101c3a; }

    html.intro-on, html.intro-on body { overflow: hidden; }

    body {
      box-sizing: border-box;
      overflow-x: hidden;
      place-items: center;
      padding: 10px 28px;
      -webkit-touch-callout: none;
    }

    .home { z-index: 40; }

    button { touch-action: manipulation; }

    /* Jemná záře za automatem: modrá uprostřed, růžová u nápisu */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 30% 16% at 50% 14%, rgba(255, 90, 170, 0.12), transparent 70%),
        radial-gradient(ellipse 40% 55% at 50% 50%, rgba(60, 120, 220, 0.14), transparent 70%);
    }

    /* ======================================================
       ÚVOD: WELCOME TO THE GAME
       ====================================================== */
    .intro {
      position: fixed;
      inset: 0;
      z-index: 25;                    /* před automatem */
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .intro.hop2 { z-index: 5; }       /* za automatem */

    .phrase {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.1em 0.4em;
      max-width: 92vw;
      font-size: clamp(2.2rem, 10vw, 5rem);
      font-weight: 900;
      letter-spacing: 0.04em;
      text-align: center;
    }

    .w {
      display: inline-block;
      opacity: 0;
      background-image: linear-gradient(180deg, #ffffff 0%, #c4c8d8 50%, #6f7590 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0.06em 0 #2a2e44) drop-shadow(0 0.12em 0.2em rgba(0, 0, 0, 0.7));
    }

    .w.on { animation: pop 0.38s cubic-bezier(0.2, 1.4, 0.4, 1) forwards; }

    @keyframes pop {
      from { opacity: 0; transform: translateY(0.25em) scale(0.6); }
      to   { opacity: 1; transform: none; }
    }

    /* Přeskočení přes automat: nahoru, a pak za něj */
    .intro.hop1 .phrase { animation: hop1 0.65s cubic-bezier(0.2, 0.7, 0.3, 1) forwards; }
    .intro.hop2 .phrase { animation: hop2 0.75s ease-in forwards; }

    @keyframes hop1 {
      from { transform: translateY(0) scale(1); }
      to   { transform: translateY(-30vh) scale(0.78); }
    }

    @keyframes hop2 {
      from { transform: translateY(-30vh) scale(0.78); opacity: 1; }
      to   { transform: translateY(-14vh) scale(0.5); opacity: 0; }
    }

    /* ======================================================
       AUTOMAT (nakreslený lehkými čarami)
       ====================================================== */
    .stage { position: relative; }

    .machine {
      /* poměr skříně je 56 : 86, výška se přizpůsobí oknu; --u je jedna jednotka (1/560 šířky) */
      --ch: min(calc(100vh - 56px), calc((100vw - 56px) * 86 / 56), 1100px);
      --cw: calc(var(--ch) * 56 / 86);
      --u: calc(var(--cw) / 560);
      position: relative;
      z-index: 20;
      display: grid;
      justify-items: center;
      transform: translateY(115vh);                   /* na začátku schovaný pod okrajem */
    }

    @supports (height: 100svh) {
      .machine { --ch: min(calc(100svh - 56px), calc((100vw - 56px) * 86 / 56), 1100px); }
    }

    .machine.rise {
      transform: none;
      transition: transform 1s cubic-bezier(0.2, 1.05, 0.3, 1) 0.15s;
    }

    .machine.shown { transform: none; transition: none; }

    .cab {
      position: relative;
      width: var(--cw);
      height: var(--ch);
    }

    /* Čáry automatu: tenké, průhledné, světle modré. Dole se plynule vytrácejí. */
    .cab-lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      fill: none;
      stroke: rgba(130, 198, 255, 0.62);
      stroke-width: 1.3;
      stroke-linejoin: round;
      stroke-linecap: round;
      filter: drop-shadow(0 0 3px rgba(90, 170, 255, 0.6)) drop-shadow(0 0 12px rgba(60, 130, 255, 0.25));
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 86%, transparent 99%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 86%, transparent 99%);
    }

    .cab-lines * { vector-effect: non-scaling-stroke; }
    .cab-lines .soft { stroke: rgba(130, 198, 255, 0.28); }
    .cab-lines .pink { stroke: rgba(255, 150, 205, 0.85); }
    .cab-lines .body { fill: url(#cabFill); }

    .cab-lines text {
      fill: rgba(150, 210, 255, 0.75);
      stroke: none;
      font: 700 9px system-ui, sans-serif;
      letter-spacing: 2.5px;
      text-anchor: middle;
      animation: blink 1.6s steps(2, jump-none) infinite;
    }

    /* ---------- Nápis DRIPPY: růžový led s kapkami vody ---------- */
    .marquee {
      --mh: calc(var(--u) * 66);                      /* výška písmen v nápisu */
      position: absolute;
      left: 16.071%;
      top: 2.326%;
      width: 67.857%;
      height: 11.395%;
      display: grid;
      place-items: center;
      border-radius: calc(var(--u) * 14);
      background: linear-gradient(180deg, rgba(255, 110, 185, 0.14), rgba(24, 8, 28, 0.55));
      box-shadow:
        inset 0 0 calc(var(--u) * 22) rgba(255, 110, 190, 0.2),
        0 0 calc(var(--u) * 18) rgba(255, 90, 170, 0.2);
    }

    .word {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(var(--mh) * 0.1);
    }

    /* Písmena po otevření automatu jedno po druhém vyskočí, pak stojí v klidu */
    .ml { display: block; opacity: 0; }

    .machine.rise .ml {
      animation: popin 0.55s cubic-bezier(0.2, 1.4, 0.4, 1) forwards;
      animation-delay: calc(1s + var(--n) * 0.08s);
    }

    .machine.shown .ml {
      animation: popin 0.55s cubic-bezier(0.2, 1.4, 0.4, 1) forwards;
      animation-delay: calc(0.1s + var(--n) * 0.08s);
    }

    @keyframes popin {
      0%   { opacity: 0; transform: translateY(calc(var(--u) * 14)) scale(0.6); }
      100% { opacity: 1; transform: none; }
    }

    .mg {
      display: block;
      overflow: visible;
      width: calc(var(--mh) * 0.7);
      height: var(--mh);
      filter: drop-shadow(0 calc(var(--u) * 2) calc(var(--u) * 3) rgba(0, 0, 0, 0.55));
    }

    .mg-body {
      fill: url(#iceGrad) #ff7fbf;
      filter: url(#iceFx);
    }

    /* Kapky vody: narostou na konci kapky, odtrhnou se a spadnou */
    .wdrop {
      fill: url(#waterGrad);
      opacity: 0;
      transform-box: fill-box;
      transform-origin: 50% 0;
      animation: wfall var(--fd, 5s) linear infinite;
      animation-delay: var(--fl, 0s);
    }

    @keyframes wfall {
      0%   { transform: scale(0); opacity: 0; animation-timing-function: ease-out; }
      35%  { transform: scale(1); opacity: 1; animation-timing-function: cubic-bezier(0.5, 0, 0.9, 0.5); }
      80%  { transform: translateY(46px) scale(0.9, 1.25); opacity: 1; }
      100% { transform: translateY(58px) scale(0.8, 1.3); opacity: 0; }
    }

    /* ---------- Obrazovka ---------- */
    .screen {
      position: absolute;
      left: 14.286%;
      top: 17.209%;
      width: 71.429%;
      height: 62.016%;
      border-radius: calc(var(--u) * 10);
      overflow: hidden;
      background: #060b16;
      box-shadow: 0 0 0 1px rgba(130, 198, 255, 0.55), 0 0 calc(var(--u) * 28) rgba(80, 160, 255, 0.3);
      user-select: none;
      -webkit-user-select: none;
    }

    /* Sklo obrazovky: odlesk a jemné linky */
    .glass {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      border-radius: inherit;
      background:
        linear-gradient(135deg, rgba(190, 225, 255, 0.1) 0%, rgba(190, 225, 255, 0) 30%),
        repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.1) 0 1px, transparent 1px 3px);
      box-shadow: inset 0 0 calc(var(--u) * 30) rgba(0, 0, 0, 0.6);
    }

    .pane {
      position: absolute;
      inset: 0;
      display: none;
    }

    .pane.show { display: block; }

    #paneGame { touch-action: none; }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Čas nahoře při hře */
    .hud {
      position: absolute;
      top: calc(var(--u) * 10);
      left: 0;
      right: 0;
      text-align: center;
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }

    #timeEl {
      display: block;
      font-size: max(20px, calc(var(--u) * 38));
      font-weight: 800;
      background-image: linear-gradient(180deg, #ffffff 0%, #c4c8d8 55%, #7d8399 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.7));
    }

    #bestEl {
      display: block;
      margin-top: 1px;
      font-size: max(9px, calc(var(--u) * 10));
      letter-spacing: 0.1em;
      color: rgba(190, 225, 255, 0.55);
    }

    .weekline {
      position: absolute;
      left: calc(var(--u) * 10);
      top: calc(var(--u) * 2);
      font-size: max(8px, calc(var(--u) * 8.5));
      letter-spacing: 0.1em;
      color: rgba(190, 225, 255, 0.4);
    }

    /* Překryvné obrazovky ve hře */
    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: calc(var(--u) * 12);
      padding: calc(var(--u) * 16);
      text-align: center;
      background: rgba(5, 10, 22, 0.78);
    }

    .overlay.show { display: flex; }
    .overlay.clear { background: transparent; pointer-events: none; }

    .ov-title {
      font-size: max(24px, calc(var(--u) * 44));
      font-weight: 900;
      letter-spacing: -0.01em;
      background-image: linear-gradient(180deg, #ffb3dc 0%, #ff4fa6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 calc(var(--u) * 8) rgba(255, 90, 170, 0.55));
    }

    .ov-text { margin: 0; font-size: max(11px, calc(var(--u) * 15)); color: var(--ink); }
    .ov-small { margin: 0; font-size: max(9px, calc(var(--u) * 11)); letter-spacing: 0.08em; color: rgba(190, 225, 255, 0.6); }

    .blink { animation: blink 1.2s steps(2, jump-none) infinite; }
    @keyframes blink { 50% { opacity: 0.25; } }

    .count-num {
      font-size: calc(var(--u) * 130);
      font-weight: 900;
      background-image: linear-gradient(180deg, #ffb3dc 0%, #ff4fa6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.7));
    }

    .over-time {
      font-size: max(30px, calc(var(--u) * 62));
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      background-image: linear-gradient(180deg, #ffffff 0%, #c4c8d8 50%, #6f7590 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .btn {
      padding: calc(var(--u) * 10) calc(var(--u) * 26);
      border: 1px solid rgba(160, 215, 255, 0.6);
      border-radius: 999px;
      background: rgba(130, 198, 255, 0.1);
      color: #e4f3ff;
      font: inherit;
      font-size: max(12px, calc(var(--u) * 15));
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(100, 180, 255, 0.2);
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .btn:hover, .btn:focus-visible { background: rgba(130, 198, 255, 0.22); outline: none; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: default; }

    .name-form { display: flex; gap: calc(var(--u) * 8); align-items: stretch; flex-wrap: wrap; justify-content: center; }

    .name-form input {
      width: max(120px, calc(var(--u) * 170));
      padding: calc(var(--u) * 10) calc(var(--u) * 14);
      border: 1px solid rgba(160, 215, 255, 0.4);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.35);
      color: #e4f3ff;
      font: inherit;
      font-size: 16px;                     /* 16px = iPhone nezoomuje při psaní */
      text-align: center;
      outline: none;
    }

    .name-form input:focus { border-color: rgba(190, 230, 255, 0.85); }

    /* ======================================================
       SCORE: pódium, seznam a karta nejlepšího hráče
       ====================================================== */
    .scroll {
      height: 100%;
      overflow-y: auto;
      box-sizing: border-box;              /* ať padding nepřetéká a jde doscrollovat úplně dolů */
      padding: calc(var(--u) * 22) calc(var(--u) * 18) calc(var(--u) * 40);
      background: rgba(5, 10, 22, 0.94);
      text-align: left;
      scrollbar-width: thin;
      scrollbar-color: rgba(150, 210, 255, 0.3) transparent;
      touch-action: pan-y;
    }

    .scroll h2 {
      margin: 0 0 calc(var(--u) * 9);
      font-size: max(10px, calc(var(--u) * 12));
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #ffa8d6;
    }

    .scroll h2 small {
      margin-left: 6px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: rgba(190, 225, 255, 0.45);
    }

    .scroll section + section { margin-top: calc(var(--u) * 22); }
    .scroll ol { margin: 0; padding: 0; list-style: none; }

    .row {
      display: grid;
      grid-template-columns: 1.6em 1fr auto;
      gap: calc(var(--u) * 8);
      padding: calc(var(--u) * 5) calc(var(--u) * 8);
      border-radius: 8px;
      font-size: max(11px, calc(var(--u) * 14));
      font-variant-numeric: tabular-nums;
    }

    .row .rank { color: rgba(190, 225, 255, 0.45); }
    .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
    .row .time { color: #ffffff; font-weight: 700; }
    .row.me { background: rgba(255, 130, 195, 0.16); }
    .row.empty { grid-template-columns: 1fr; color: rgba(190, 225, 255, 0.4); font-size: max(10px, calc(var(--u) * 12)); }
    .row.gap { color: rgba(190, 225, 255, 0.35); padding-top: 0; padding-bottom: 0; }

    .empty-note { margin: calc(var(--u) * 8) 0; font-size: max(10px, calc(var(--u) * 12)); color: rgba(190, 225, 255, 0.4); }

    .note { margin: calc(var(--u) * 18) 0 0; font-size: max(9px, calc(var(--u) * 10.5)); line-height: 1.5; color: rgba(190, 225, 255, 0.45); }

    .lang { display: flex; justify-content: flex-end; gap: calc(var(--u) * 6); margin-bottom: calc(var(--u) * 14); }
    .lang button {
      min-height: max(26px, calc(var(--u) * 28));
      padding: 0 calc(var(--u) * 12);
      border: 1px solid rgba(160, 215, 255, 0.35);
      border-radius: 999px;
      background: transparent;
      color: rgba(190, 225, 255, 0.6);
      font: 700 max(10px, calc(var(--u) * 11)) system-ui, sans-serif;
      letter-spacing: 0.12em;
      cursor: pointer;
    }
    .lang button.on { color: #ffffff; background: rgba(255, 130, 195, 0.22); border-color: #ffa8d6; }

    /* Obrázky v pravidlech jsou malá plátna zvětšená bez vyhlazení */
    .ico {
      display: block;
      flex: none;
      width: calc(var(--u) * 112);
      height: auto;
      image-rendering: pixelated;
      border-radius: 8px;
      border: 1px solid rgba(160, 215, 255, 0.2);
    }

    .how { display: flex; gap: calc(var(--u) * 12); align-items: center; }
    .how-t p { margin: 0; }

    .ctrl { list-style: none; margin: calc(var(--u) * 12) 0 0; padding: 0; display: grid; gap: calc(var(--u) * 8); }
    .ctrl li { display: grid; grid-template-columns: 5.2em 1fr; gap: calc(var(--u) * 8); align-items: baseline; font-size: max(11px, calc(var(--u) * 13)); line-height: 1.5; color: rgba(225, 240, 255, 0.82); }
    .ctrl .ck { font-weight: 700; letter-spacing: 0.08em; color: #ffa8d6; font-size: max(9px, calc(var(--u) * 10.5)); text-transform: uppercase; }
    .key {
      display: inline-block;
      min-width: 1.6em;
      margin-right: 0.25em;
      padding: 0.05em 0.35em;
      border: 1px solid rgba(160, 215, 255, 0.55);
      border-bottom-width: 2px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.06);
      text-align: center;
      font-weight: 700;
      color: #ffffff;
    }
    .rules p.tip { margin-top: calc(var(--u) * 12); color: rgba(190, 225, 255, 0.6); font-size: max(10.5px, calc(var(--u) * 12.5)); }

    .rules p + .lvs { margin-top: calc(var(--u) * 12); }
    .lvs { list-style: none; margin: 0; padding: 0; display: grid; gap: calc(var(--u) * 10); }
    .lvs li { display: flex; gap: calc(var(--u) * 12); align-items: center; }
    .lvs .ln { font-weight: 700; letter-spacing: 0.1em; font-size: max(10.5px, calc(var(--u) * 12.5)); }
    .lvs .ltime { margin-left: 0.7em; font-weight: 500; letter-spacing: 0.04em; color: rgba(190, 225, 255, 0.5); font-variant-numeric: tabular-nums; }
    .lvs .lnote { margin-top: 2px; font-size: max(10.5px, calc(var(--u) * 12.5)); line-height: 1.4; color: rgba(225, 240, 255, 0.78); }

    .gears { display: flex; justify-content: space-between; gap: calc(var(--u) * 6); }
    .gv { flex: 1; text-align: center; }
    .gv canvas { display: block; margin: 0 auto; width: calc(var(--u) * 64); height: calc(var(--u) * 64); image-rendering: pixelated; }
    .gcap { margin-top: 2px; font-size: max(9px, calc(var(--u) * 10.5)); font-weight: 700; letter-spacing: 0.08em; color: rgba(225, 240, 255, 0.8); }

    .rules p { margin: 0; font-size: max(11px, calc(var(--u) * 13.5)); line-height: 1.55; color: rgba(225, 240, 255, 0.82); }
    .rules p b { color: #ffffff; }

    /* Barvy jednotlivých výbav (pódium, karta, tečky) */
    .pod, .alltime, .prow { --rgb: 130, 198, 255; --c: #cfe6ff; }
    .g-red     { --rgb: 255, 45, 79;   --c: #ff6a80; }
    .g-purple  { --rgb: 168, 85, 255;  --c: #cfa6ff; }
    .g-green   { --rgb: 45, 255, 138;  --c: #6dffae; }
    .g-diamond { --rgb: 150, 215, 255; --c: #d8efff; }

    .podium {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: calc(var(--u) * 8);
      align-items: end;
      margin: calc(var(--u) * 6) 0 calc(var(--u) * 14);
    }

    .pod {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
      text-align: center;
    }

    .av {
      display: block;
      flex: none;
      width: calc(var(--u) * 92);
      height: calc(var(--u) * 92);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      filter: drop-shadow(0 0 calc(var(--u) * 8) rgba(var(--rgb), 0.45));
    }

    .pname {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      max-width: 100%;
      font-size: max(10px, calc(var(--u) * 14));
      font-weight: 700;
      color: #ffffff;
    }

    .pn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .you {
      flex: none;
      padding: 1px 6px;
      border: 1px solid rgba(255, 130, 195, 0.6);
      border-radius: 999px;
      background: rgba(255, 130, 195, 0.22);
      color: #ffd1ea;
      font-size: max(7px, calc(var(--u) * 8));
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .ptime {
      margin-bottom: calc(var(--u) * 6);
      font-size: max(10px, calc(var(--u) * 13));
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--c);
      text-shadow: 0 0 calc(var(--u) * 8) rgba(var(--rgb), 0.7);
    }

    .pblock {
      position: relative;
      width: 100%;
      overflow: hidden;
      display: grid;
      place-items: center;
      border: 1px solid rgba(var(--rgb), 0.8);
      border-bottom: 0;
      border-radius: calc(var(--u) * 8) calc(var(--u) * 8) 0 0;
      background: linear-gradient(180deg, rgba(var(--rgb), 0.24), rgba(var(--rgb), 0.05));
      box-shadow: 0 0 calc(var(--u) * 16) rgba(var(--rgb), 0.35), inset 0 0 calc(var(--u) * 14) rgba(var(--rgb), 0.2);
    }

    .pod-1 .pblock { height: calc(var(--u) * 64); }
    .pod-2 .pblock { height: calc(var(--u) * 46); }
    .pod-3 .pblock { height: calc(var(--u) * 34); }

    .pnum {
      position: relative;
      z-index: 2;
      font-size: max(18px, calc(var(--u) * 30));
      font-weight: 900;
      color: var(--c);
      text-shadow: 0 0 calc(var(--u) * 10) rgba(var(--rgb), 0.9);
    }

    .pod.empty .pblock { opacity: 0.4; }
    .pod.empty .pnum { opacity: 0.6; }

    /* Efekty bloků: každé místo má vlastní */
    .pblock::before, .pblock::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Červená: oheň a žhavé jiskry */
    .g-red .pblock { animation: flame 1.7s ease-in-out infinite; }

    .g-red .pblock::before {
      background:
        radial-gradient(circle at 20% 50%, #ffb03c 0 1.5px, transparent 2.5px),
        radial-gradient(circle at 70% 20%, #ff2d4f 0 1.5px, transparent 2.5px),
        radial-gradient(circle at 45% 80%, #ffd36b 0 1px, transparent 2px);
      background-size: 34px 46px, 41px 52px, 27px 38px;
      animation: embers 2.4s linear infinite;
    }

    .g-red .pblock::after {
      background: linear-gradient(to top, rgba(255, 60, 40, 0.4), transparent 65%);
      animation: flicker 0.9s ease-in-out infinite alternate;
    }

    @keyframes embers { to { background-position: 0 -46px, 0 -52px, 0 -38px; } }
    @keyframes flicker { from { opacity: 0.45; } to { opacity: 1; } }
    @keyframes flame {
      0%, 100% {
        box-shadow: 0 0 calc(var(--u) * 14) rgba(255, 45, 79, 0.35), inset 0 0 calc(var(--u) * 12) rgba(255, 45, 79, 0.2);
      }
      50% {
        box-shadow: 0 0 calc(var(--u) * 26) rgba(255, 90, 40, 0.6), inset 0 0 calc(var(--u) * 18) rgba(255, 90, 40, 0.3);
      }
    }

    /* Fialová: kometa obíhá po okraji a obraz občas "glitchne" */
    .g-purple .pblock::before,
    .g-diamond .pblock::before,
    .alltime.g-diamond::before {
      padding: 1.5px;
      border-radius: inherit;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      animation: spin 3s linear infinite;
    }

    .g-purple .pblock::before {
      background: conic-gradient(from var(--ang), rgba(168, 85, 255, 0.15) 0 55%, #b07dff 78%, #ffffff 90%, rgba(168, 85, 255, 0.15) 100%);
    }

    .g-purple .pblock::after {
      background: repeating-linear-gradient(0deg, rgba(168, 85, 255, 0.14) 0 2px, transparent 2px 6px);
      animation: glitch 3.2s steps(1) infinite;
    }

    @keyframes glitch {
      0%, 100% { transform: none; }
      12% { transform: translateX(3px); }
      14% { transform: translateX(-2px); }
      16% { transform: none; }
      60% { transform: translateX(-3px) skewX(-6deg); }
      62% { transform: none; }
    }

    /* Zelená: elektrický výboj a pobíhající paprsek */
    .g-green .pblock::before {
      inset: 0 0 auto 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(220, 255, 235, 0.95), transparent);
      animation: scanY 2.1s linear infinite;
    }

    .g-green .pblock::after { animation: zap 2.6s steps(1) infinite; }

    @keyframes scanY { from { top: -2px; } to { top: 100%; } }
    @keyframes zap {
      0%, 9%, 52%, 59%, 100% { box-shadow: inset 0 0 0 1px rgba(45, 255, 138, 0.9), inset 0 0 12px rgba(45, 255, 138, 0.25); }
      7%, 57% { box-shadow: inset 0 0 0 1px #eafff2, inset 0 0 20px rgba(190, 255, 215, 0.7); }
      50% { box-shadow: inset 0 0 0 1px #eafff2, inset 0 0 24px rgba(190, 255, 215, 0.8); }
    }

    /* Diamant: duhový rám a lesk, který přejíždí přes blok */
    .g-diamond .pblock::before,
    .alltime.g-diamond::before {
      background: conic-gradient(from var(--ang), #ff7ad9, #7ad7ff, #8affc1, #fff59a, #ff7ad9);
    }

    .g-diamond .pblock::after,
    .alltime.g-diamond::after {
      background: linear-gradient(115deg, transparent 38%, rgba(255, 255, 255, 0.5) 50%, transparent 62%);
      background-size: 260% 100%;
      animation: sweep 3s ease-in-out infinite;
    }

    @keyframes sweep { from { background-position: 130% 0; } to { background-position: -30% 0; } }

    /* Karta ALL-TIME */
    .alltime {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 14);
      padding: calc(var(--u) * 10) calc(var(--u) * 14);
      border-radius: calc(var(--u) * 12);
      background: linear-gradient(135deg, rgba(var(--rgb), 0.16), rgba(10, 20, 40, 0.4));
      box-shadow: 0 0 calc(var(--u) * 20) rgba(var(--rgb), 0.3), inset 0 0 calc(var(--u) * 16) rgba(var(--rgb), 0.15);
    }

    .alltime.g-diamond::before,
    .alltime.g-diamond::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .alltime .av { width: calc(var(--u) * 76); height: calc(var(--u) * 76); }
    .ainfo { position: relative; z-index: 2; min-width: 0; }
    .alabel { font-size: max(8px, calc(var(--u) * 9.5)); font-weight: 700; letter-spacing: 0.16em; color: var(--c); }
    .aname { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: max(13px, calc(var(--u) * 20)); font-weight: 800; color: #ffffff; }
    .atime { margin-top: 2px; font-size: max(11px, calc(var(--u) * 15)); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--c); }

    /* Minulý týden: tlumené barvy */
    .prow {
      display: grid;
      grid-template-columns: auto 1.8em 1fr auto;
      gap: calc(var(--u) * 8);
      align-items: center;
      padding: calc(var(--u) * 5) calc(var(--u) * 8);
      font-size: max(11px, calc(var(--u) * 14));
      font-variant-numeric: tabular-nums;
      opacity: 0.75;
    }

    .prow .dot {
      width: calc(var(--u) * 9);
      height: calc(var(--u) * 9);
      border-radius: 50%;
      background: var(--c);
      box-shadow: 0 0 calc(var(--u) * 6) rgba(var(--rgb), 0.8);
    }

    .prow .rank { color: rgba(190, 225, 255, 0.5); }
    .prow .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
    .prow .time { color: #ffffff; font-weight: 700; }

    /* ---------- Úrovně: štítek nahoře a nápis při změně ---------- */
    #lvlEl {
      display: block;
      margin-top: 2px;
      font-size: max(8px, calc(var(--u) * 9));
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--lc, #8fd0ff);
      text-shadow: 0 0 calc(var(--u) * 8) var(--lc, #8fd0ff);
    }

    #windEl {
      display: block;
      min-height: 1.2em;
      margin-top: 1px;
      font-size: max(8px, calc(var(--u) * 9));
      font-weight: 700;
      letter-spacing: 0.14em;
      color: rgba(200, 235, 235, 0.8);
    }

    .lvl-banner {
      position: absolute;
      left: 0;
      right: 0;
      top: 24%;
      z-index: 5;
      display: grid;
      justify-items: center;
      gap: calc(var(--u) * 2);
      opacity: 0;
      pointer-events: none;
      color: var(--lc, #8fd0ff);
      text-shadow: 0 0 calc(var(--u) * 14) var(--lc, #8fd0ff), 0 2px 6px rgba(0, 0, 0, 0.8);
    }

    .lvl-banner small { font-size: max(9px, calc(var(--u) * 12)); font-weight: 700; letter-spacing: 0.3em; }
    .lvl-banner b { font-size: max(18px, calc(var(--u) * 36)); font-weight: 900; letter-spacing: 0.08em; }
    .lvl-banner em { font-style: normal; font-size: max(9px, calc(var(--u) * 11)); letter-spacing: 0.14em; opacity: 0.85; }
    .lvl-banner.go { animation: lvlin 2.4s ease both; }

    @keyframes lvlin {
      0%   { opacity: 0; transform: translateY(8px) scale(0.92); }
      14%  { opacity: 0.95; transform: none; }
      70%  { opacity: 0.95; transform: none; }
      100% { opacity: 0; transform: translateY(-6px); }
    }

    /* ---------- Ovládací pult: START ---------- */
    .start-btn {
      position: absolute;
      left: 41.07%;
      top: 83.02%;
      width: 17.86%;
      height: 3.95%;
      border: 1px solid rgba(255, 160, 210, 0.85);
      border-radius: 10px;
      background: rgba(255, 110, 190, 0.12);
      color: #ffe9f5;
      font: 800 max(9px, calc(var(--u) * 12))/1 system-ui, sans-serif;
      letter-spacing: 0.12em;
      text-shadow: 0 0 8px rgba(255, 110, 190, 0.9);
      box-shadow: 0 0 12px rgba(255, 100, 180, 0.35), inset 0 0 8px rgba(255, 110, 190, 0.18);
      cursor: pointer;
      transition: transform 0.12s ease, background 0.2s ease;
    }

    .start-btn:hover { background: rgba(255, 110, 190, 0.24); }
    .start-btn:active { transform: translateY(2px); }
    .start-btn:focus-visible { outline: 2px solid rgba(255, 230, 245, 0.85); outline-offset: 2px; }

    .start-btn.ready { animation: startglow 1.6s ease-in-out infinite; }

    @keyframes startglow {
      50% { box-shadow: 0 0 22px rgba(255, 120, 195, 0.8), inset 0 0 10px rgba(255, 140, 205, 0.3); }
    }

    /* ---------- Páka ---------- */
    .lever {
      position: absolute;
      left: 92.5%;
      top: 25%;
      width: calc(var(--u) * 58);
      height: calc(var(--u) * 220);
      touch-action: none;
      cursor: grab;
      outline: none;
    }

    .lever.grab { cursor: grabbing; }

    .lever-base {
      position: absolute;
      left: 0;
      top: calc(50% - var(--u) * 26);
      width: calc(var(--u) * 18);
      height: calc(var(--u) * 52);
      border: 1px solid rgba(160, 215, 255, 0.7);
      border-radius: calc(var(--u) * 7);
      background: rgba(130, 198, 255, 0.12);
      box-shadow: 0 0 10px rgba(100, 180, 255, 0.35);
      box-sizing: border-box;
    }

    .lever-rod {
      position: absolute;
      left: 50%;
      width: calc(var(--u) * 6);
      margin-left: calc(var(--u) * -3);
      border-radius: 6px;
      background: linear-gradient(90deg, rgba(120, 190, 255, 0.5), rgba(230, 245, 255, 0.95) 50%, rgba(120, 190, 255, 0.5));
      box-shadow: 0 0 8px rgba(100, 180, 255, 0.5);
    }

    .lever-knob {
      position: absolute;
      left: 50%;
      width: calc(var(--u) * 44);
      height: calc(var(--u) * 44);
      margin-left: calc(var(--u) * -22);
      border: 1.5px solid rgba(255, 190, 225, 0.9);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 160, 210, 0.6) 38%, rgba(170, 30, 110, 0.6) 80%);
      box-shadow: 0 0 18px rgba(255, 100, 180, 0.55), 0 8px 16px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }

    .lever:focus-visible .lever-knob { outline: 2px solid rgba(255, 255, 255, 0.8); outline-offset: 3px; }

    /* ---------- Přepínač GAME / SCORE / RULES dole pod automatem ---------- */
    .modebar {
      --i: 0;
      position: relative;
      z-index: 3;
      margin-top: -34px;
      width: min(var(--cw), 440px);
      height: 46px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid rgba(130, 198, 255, 0.5);
      border-radius: 999px;
      background: rgba(8, 18, 40, 0.72);
      box-shadow: inset 0 0 12px rgba(80, 160, 255, 0.14), 0 0 18px rgba(80, 160, 255, 0.2);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: calc((100% - 6px) / 3);
      height: calc(100% - 6px);
      border-radius: 999px;
      background: rgba(130, 198, 255, 0.22);
      border: 1px solid rgba(170, 220, 255, 0.85);
      box-shadow: 0 0 14px rgba(100, 180, 255, 0.5), inset 0 0 8px rgba(160, 215, 255, 0.3);
      box-sizing: border-box;
      transform: translateX(calc(var(--i) * 100%));
      transition: transform 0.28s cubic-bezier(0.3, 1.5, 0.5, 1);
    }

    .modebar button {
      position: relative;
      z-index: 1;
      min-height: 44px;
      border: 0;
      background: none;
      color: rgba(170, 215, 255, 0.6);
      font: 700 12px/1 system-ui, sans-serif;
      letter-spacing: 0.16em;
      cursor: pointer;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .modebar button.on { color: #eaf6ff; text-shadow: 0 0 8px rgba(130, 198, 255, 0.9); }
    .modebar button:focus-visible { outline: 2px solid rgba(200, 235, 255, 0.7); outline-offset: -3px; border-radius: 999px; }

    .mute-btn {
      position: absolute;
      top: calc(var(--u) * 8);
      left: calc(var(--u) * 8);
      z-index: 8;
      width: max(32px, calc(var(--u) * 32));
      height: max(32px, calc(var(--u) * 32));
      border: 1px solid rgba(160, 215, 255, 0.4);
      border-radius: 50%;
      background: rgba(5, 10, 22, 0.5);
      color: #e4f3ff;
      font: 700 max(14px, calc(var(--u) * 16)) system-ui, sans-serif;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }
    .mute-btn.off { opacity: 0.55; text-decoration: line-through; }
    .screen[data-mode="score"] .mute-btn, .screen[data-mode="rules"] .mute-btn { display: none; }

    /* ---------- Telefon: menší okraje a celoobrazovkový režim hry ---------- */
    .fs-exit {
      display: none;
      position: absolute;
      top: calc(var(--u) * 8);
      right: calc(var(--u) * 8);
      z-index: 8;
      width: max(40px, calc(var(--u) * 40));
      height: max(40px, calc(var(--u) * 40));
      border: 1px solid rgba(160, 215, 255, 0.5);
      border-radius: 50%;
      background: rgba(5, 10, 22, 0.55);
      color: #e4f3ff;
      font: 700 max(14px, calc(var(--u) * 16)) system-ui, sans-serif;
      cursor: pointer;
    }

    .fs-only { display: none; }

    body.fs { overflow: hidden; }
    body.fs .fs-exit { display: block; }
    body.fs .fs-only { display: inline-block; }
    body.fs .nofs { display: none; }

    /* Automat se schová a obrazovka hry se roztáhne na celý telefon */
    body.fs .home, body.fs .cab-lines, body.fs .marquee,
    body.fs .start-btn, body.fs .lever, body.fs .modebar { visibility: hidden; }

    body.fs .screen {
      --sw: min(100vw, 75vh);
      --u: calc(var(--sw) / 400);
      position: fixed;
      inset: 0;
      z-index: 30;
      width: auto;
      height: auto;
      border-radius: 0;
      box-shadow: none;
      background: linear-gradient(to bottom, var(--bar-top) 50%, var(--bar-bot) 50%);
      transition: --bar-top 1.5s linear, --bar-bot 1.5s linear;
    }

    /* Hřiště zůstává vždy 3:4 uprostřed, zbytek obrazovky vyplní barvy úrovně */
    body.fs canvas {
      position: absolute;
      inset: 0;
      margin: auto;
      width: var(--sw);
      height: calc(var(--sw) * 4 / 3);
    }

    @supports (height: 100svh) {
      body.fs .screen { --sw: min(100vw, 75svh); }
    }

    /* Na dotykových zařízeních jsou postranní okraje menší, automat tedy vyjde větší */
    @media (pointer: coarse) and (max-width: 900px) {
      body { padding: 8px 10px; }
      .machine { --ch: min(calc(100vh - 56px), calc((100vw - 20px) * 86 / 56), 1100px); }
    }

    @supports (height: 100svh) {
      @media (pointer: coarse) and (max-width: 900px) {
        .machine { --ch: min(calc(100svh - 56px), calc((100vw - 20px) * 86 / 56), 1100px); }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .wdrop, .blink, .start-btn.ready, .cab-lines text,
      .pblock, .pblock::before, .pblock::after,
      .alltime::before, .alltime::after { animation: none !important; }
      .ml { opacity: 1; }
    }
  </style>

<body>
  <!-- Značka vlevo nahoře: zpočátku domeček, po příchodu z hlavní stránky kliknuté písmeno -->
  <a class="home" id="mark" href="index.html" aria-label="Zpět na hlavní stránku">

  </a>

  <!-- Skrytá definice: růžový led a voda pro nápis DRIPPY -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <!-- Růžový přechod: světlejší nahoře, sytější dole -->
      <linearGradient id="iceGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100">
        <stop offset="0" stop-color="#ffb3dc"/>
        <stop offset="1" stop-color="#ff4fa6"/>
      </linearGradient>

      <!-- Kapka vody -->
      <radialGradient id="waterGrad" cx="35%" cy="30%" r="75%">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
        <stop offset="0.5" stop-color="#c4e8ff" stop-opacity="0.8"/>
        <stop offset="1" stop-color="#6fbaff" stop-opacity="0.55"/>
      </radialGradient>

      <!-- Lesklý růžový led: zaoblené hrany, světlo vlevo nahoře, stín vpravo dole -->
      <filter id="iceFx" filterUnits="userSpaceOnUse" x="-20" y="-20" width="110" height="150" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="soft"/>
        <feComponentTransfer in="soft" result="round"><feFuncA type="linear" slope="14" intercept="-6"/></feComponentTransfer>

        <feOffset in="round" dx="-2.4" dy="-2.4" result="sUL"/>
        <feComposite in="round" in2="sUL" operator="out" result="rimBR"/>
        <feGaussianBlur in="rimBR" stdDeviation="1.6" result="rimBRb"/>
        <feFlood flood-color="#b0145f" flood-opacity="0.4" result="dk"/>
        <feComposite in="dk" in2="rimBRb" operator="in" result="sh0"/>
        <feComposite in="sh0" in2="round" operator="in" result="sh"/>

        <feGaussianBlur in="rimTL" stdDeviation="1.2" result="rimTLb"/>

        <feComposite in="wh" in2="rimTLb" operator="in" result="hi0"/>
        <feComposite in="hi0" in2="round" operator="in" result="hi"/>

        <feMerge>
          <feMergeNode in="round"/>

  <!-- Úvod -->

  <main class="stage">

          <!-- Obrys skříně: nápis, tělo, pult a spodní část (vytrácí se) -->

          <circle class="soft" cx="392" cy="731" r="9"/>
          <circle class="soft" cx="428" cy="731" r="9"/>

          <!-- Dvířka na mince (vytrácejí se) -->
          <rect x="224" y="782" width="112" height="70" rx="8"/>

  <script>
  (function () {

    /* ================= NASTAVENÍ ================= */

    // Adresa webové aplikace z Apps Script (končí na /exec).

    // Zakázaná slova v přezdívkách (základní filtr, doplň si podle potřeby)

    const GAIN = 1.25;           // citlivost tažení (1 = panáček ujede přesně tolik co prst)

    // Obtížnost: [sekunda, interval mezi kapkami (kroky), rychlost pádu]. Mezi body se plynule přechází.
    const CURVE = [
      [0, 40, 1.1], [20, 32, 1.3], [40, 27, 1.45], [80, 25, 1.55], [130, 22, 1.7],
      [180, 20, 1.85], [250, 18, 2.0], [350, 16, 2.15], [450, 15, 2.3], [600, 14, 2.4]

    // Barvy kapek: světle modré, azurové, kyselé zelené a magenta
    const RAIN_PALS = [
      { body: '#c6e4ff', edge: '#6ea4d8', hi: '#ffffff' },
      { body: '#43c6ff', edge: '#1f86d0', hi: '#e2f7ff' },
      { body: '#b6ff3c', edge: '#5ea60a', hi: '#f4ffd0' },

    // Úrovně: od které sekundy, název, barvy prostředí, druhy věcí co padají [druh, váha],
    // síla větru (0 = žádný), řidší déšť (thin), záclony (curtain = pauza mezi nimi v krocích,
    // slope = šikmá vlna), svítící kapky ve tmě (glow) a popisek, který se ukáže při přechodu
    const LEVELS = [
      { from: 0,   name: 'Drizzle',   accent: '#8fd0ff', sky: ['#060c1f', '#0e1c45'], stars: ['#2a3d78', '#6f8fe0'], line: '#7fa8e8', tile: ['#101c3a', '#16254a'],
        pal: RAIN_PALS[0], kinds: [['rain', 1]], wind: 0, thin: 1, curtain: 0, slope: false, glow: false, hint: '' },
      { from: 20,  name: 'Gale',      accent: '#7fe3d6', sky: ['#071418', '#10303a'], stars: ['#24505a', '#7cc8c0'], line: '#6cc0b8', tile: ['#0b222a', '#102f38'],
        pal: { body: '#a8d8d0', edge: '#5f9a94', hi: '#effffc' }, kinds: [['rain', 1]], wind: 0.55, thin: 0.9, curtain: 0, slope: false, glow: false, hint: 'WIND PUSHES THE DROPS' },
      { from: 40,  name: 'Acid rain', accent: '#b6ff3c', sky: ['#020d07', '#08281a'], stars: ['#1d5a36', '#3fb06a'], line: '#6dff9e', tile: ['#0a2416', '#0f3220'],
        pal: RAIN_PALS[2], kinds: [['zig', 3], ['rain', 2]], wind: 0, thin: 1, curtain: 0, slope: false, glow: false, hint: 'BLOBS WOBBLE LEFT AND RIGHT' },
      { from: 80,  name: 'Curtain',   accent: '#ffd45a', sky: ['#140e02', '#3a2a06'], stars: ['#6a5012', '#ffd45a'], line: '#ffcf4a', tile: ['#241a05', '#33250a'],
        pal: { body: '#ffd45a', edge: '#b58400', hi: '#fff4c2' }, kinds: [['rain', 3], ['zig', 1]], wind: 0, thin: 1.6, curtain: 260, slope: false, glow: false, hint: 'RUN TO THE GOLDEN GAP' },
      { from: 130, name: 'Meteors',   accent: '#ff8a2a', sky: ['#1a0504', '#4d1608'], stars: ['#7a3014', '#d9602a'], line: '#ff7a3c', tile: ['#2a0e08', '#3a1509'],
        pal: RAIN_PALS[0], kinds: [['meteor', 3], ['rain', 2]], wind: 0, thin: 1.35, curtain: 0, slope: false, glow: false, hint: 'A WARNING SHOWS WHERE THEY COME FROM' },
      { from: 180, name: 'Frost',     accent: '#9fe2ff', sky: ['#06141f', '#12425c'], stars: ['#2a6a8a', '#d8f4ff'], line: '#9fe2ff', tile: ['#0a2230', '#103244'],
        pal: { body: '#bfeaff', edge: '#5fb4e6', hi: '#ffffff' }, kinds: [['rain', 3], ['ice', 2]], wind: 0.2, thin: 1.5, curtain: 0, slope: false, glow: false, hint: 'ICE SHATTERS MID-AIR' },
      { from: 250, name: 'Cascade',   accent: '#6aa8ff', sky: ['#050b24', '#0b2a6a'], stars: ['#1f3a8a', '#8fb8ff'], line: '#6aa8ff', tile: ['#08143a', '#0d1f55'],
        pal: { body: '#9fc4ff', edge: '#4a78d0', hi: '#ffffff' }, kinds: [['rain', 2], ['zig', 1]], wind: 0, thin: 1.7, curtain: 280, slope: true, glow: false, hint: 'THE WAVE TILTS. STAY IN THE GAP' },
      { from: 350, name: 'Blackout',  accent: '#c8c8ff', sky: ['#000000', '#050508'], stars: ['#15151c', '#40405a'], line: '#6a6a8a', tile: ['#030305', '#07070b'],
        pal: { body: '#f0f4ff', edge: '#7a86c0', hi: '#ffffff' }, kinds: [['rain', 3], ['zig', 2], ['meteor', 1]], wind: 0, thin: 1.25, curtain: 0, slope: false, glow: true, hint: 'YOU ONLY SEE WHAT SHINES' },
      { from: 450, name: 'Tempest',   accent: '#ff7ad9', sky: ['#0b0720', '#1d1448'], stars: ['#3a2f78', '#8f7bff'], line: '#ff7ad9', tile: ['#150f33', '#1d1646'],
        pal: RAIN_PALS[3], kinds: [['rain', 2], ['zig', 2], ['ice', 2], ['meteor', 1]], wind: 0.4, thin: 1.5, curtain: 340, slope: true, glow: false, hint: 'WIND, WAVES AND LIGHTNING' },
      { from: 600, name: 'Void',      accent: '#ff3df0', sky: ['#000000', '#220520'], stars: ['#7a2a78', '#ffffff'], line: '#ff3df0', tile: ['#0a010a', '#160315'],
        pals: RAIN_PALS, kinds: [['rain', 2], ['meteor', 2], ['ice', 1], ['zig', 2]], wind: 0.3, thin: 1.8, curtain: 300, slope: true, glow: false, hint: 'EVERYTHING AT ONCE' }
    ];

    // Boxerka u kraje: jak dlouho smíš stát u zdi (kroky) a jak daleko od zdi to je "u zdi"
    const EDGE_ZONE = 22;        // pixelů od okraje hřiště
    const EDGE_WARN = 180;       // po 3 s se pěst ukáže a třese se
    const EDGE_PUNCH = 300;      // po 5 s udeří
    const PUNCH_REACH = 38;      // jak daleko od zdi pěst dosáhne
    const PUNCH_PUSH = 28;       // o kolik pixelů panáčka odsune ke středu

    // Úvod
    const INTRO_WORD_GAP = 370;  // jak rychle po sobě naskakují slova (ms)
    const INTRO_HOLD = 450;      // pauza po posledním slově (ms)

    // Zkoušení v adrese:  ?gear=red|purple|green|diamond|none  (výbava panáčka)
    //                     ?demo=board  nebo  ?demo=champ        (ukázková tabule)
    //                     ?t=150                                (začátek hry od 150. sekundy, neukládá se)
    //                     ?fs=1                                 (celoobrazovkový režim i na počítači)
    const query = new URLSearchParams(location.search);
    const gearParam = query.get('gear');
    const DEMO = query.get('demo');
    const START_T = Math.max(0, parseInt(query.get('t') || '0', 10) || 0) * 60;

    /* ================= ZÁKLAD ================= */

    // Hrací pole je 180 x 240 (poměr 3:4). Menší pole znamená, že panáček i kapky
    // jsou na obrazovce větší (stejný obrázek se roztáhne na stejnou plochu).
    const W = 180, H = 240, GROUND = 220;
    const WIDTH_SCALE = 180 / W;
    const TOUCH_MAX = 14;                      // nejvíc pixelů za jeden krok při tažení
    const MAXSTEP = 2.7 * W / 180;             // rychlost panáčka při klávesách (pixely za krok)
    const STEP_MS = 1000 / 60;
    const FALL_SCALE = 0.85;                   // pole je nižší, tak kapky padají o něco pomaleji
    const R = [2, 3, 4];                       // poloměry kapek podle velikosti                       // poloměry kapek podle velikosti

    const $ = id => document.getElementById(id);
    const screenEl = $('screen');
    const paneGame = $('paneGame');
    const cvs = $('cvs');
    const ctx = cvs.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const finePointer = window.matchMedia('(pointer: fine)').matches;

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    /* ================= KÓD HRÁČE A VÝBAVA ================= */

    // Skrytý kód, který se vytvoří při první návštěvě a zůstane v tomto zařízení
    const PID_KEY = 'fonger-player-id';

    function getPlayerId() {
      let id = '';
      try { id = localStorage.getItem(PID_KEY) || ''; } catch (e) {}
      if (!/^[A-Za-z0-9-]{8,64}$/.test(id)) {
        id = (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : Date.now().toString(36) + Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 12);
        try { localStorage.setItem(PID_KEY, id); } catch (e) {}
      }
      return id;
    }

    const PLAYER_ID = getPlayerId();

    // Kde jsem teď: pořadí v tomto týdnu a jestli jsem nejlepší za celou dobu
    let myStatus = { rank: null, champ: false };

    // Jaká výbava mi patří (diamant má přednost)
    function gearOf(s) {
      if (s.champ) return 'diamond';
      if (s.rank === 1) return 'red';
      if (s.rank === 2) return 'purple';
      if (s.rank === 3) return 'green';
      return null;
    }

    const GEAR_COLORS = { diamond: '#bfe6ff', red: '#ff5a6e', purple: '#b98cff', green: '#5dffa0' };

    // Nápis na úvodní obrazovce: kde jsem v pořadí
    function updateStatusLine() {
      const line = $('myStatus');
      const g = gearOf(myStatus);
      let text = '', color = '';
      if (myStatus.champ) {
        text = 'ALL-TIME #1';
        color = GEAR_COLORS.diamond;
      } else if (g) {
        text = "YOU'RE #" + myStatus.rank + ' THIS WEEK';
        color = GEAR_COLORS[g];
      } else if (myStatus.rank) {
        text = 'YOUR RANK: #' + myStatus.rank + ' THIS WEEK';
      }
      line.textContent = text;
      line.style.color = color;
      line.style.textShadow = color ? '0 0 8px ' + color : '';
    }

    /* ================= TÝDEN (podle pražského času) ================= */

    function pragueYMD(date) {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Europe/Prague', year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(date);
      const get = t => parseInt(parts.find(p => p.type === t).value, 10);
      return { y: get('year'), m: get('month'), d: get('day') };
    }

    function weekKeyFromYMD(y, m, d) {
      const dt = new Date(Date.UTC(y, m - 1, d));
      const dayNum = dt.getUTCDay() || 7;                 // pondělí = 1, neděle = 7
      dt.setUTCDate(dt.getUTCDate() + 4 - dayNum);        // čtvrtek tohoto týdne
      const yearStart = new Date(Date.UTC(dt.getUTCFullYear(), 0, 1));
      const week = Math.ceil(((dt - yearStart) / 86400000 + 1) / 7);
      return dt.getUTCFullYear() + '-W' + String(week).padStart(2, '0');
    }

    function currentWeek() {
      const t = pragueYMD(new Date());
      return weekKeyFromYMD(t.y, t.m, t.d);
    }

    function previousWeek() {
      const t = pragueYMD(new Date());
      const dt = new Date(Date.UTC(t.y, t.m - 1, t.d - 7));
      return weekKeyFromYMD(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate());
    }

    function todayKey() {
      const t = pragueYMD(new Date());
      return t.y + '-' + String(t.m).padStart(2, '0') + '-' + String(t.d).padStart(2, '0');
    }

    /* ================= NÁHODA SE SEMÍNKEM ================= */

    function hashString(s) {
      let h = 1779033703 ^ s.length;
      for (let i = 0; i < s.length; i++) {
        h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
        h = (h << 13) | (h >>> 19);
      }
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^ (h >>> 16)) >>> 0;
    }

    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    /* ================= STAV HRY ================= */

    let state = 'menu';          // menu, count, play, paused, over
    let mode = 'game';           // co je vidět na obrazovce: game, score, rules
    let week = currentWeek();
    let sim = null;              // stav simulace (deterministický)
    let rng = null;
    let pend = 0;                // nedokončený pohyb z prstu
    const keys = { left: false, right: false };
    let bestMs = 0;
    let lastSubmitted = null;
    let shakeUntil = 0;
    let frameCount = 0;
    let frameDt = 1 / 60;
    let countToken = 0;

    // Kreslicí "scéna": hlavní hra a malá plátýnka v tabuli mají každá vlastní částice a efekty
    let dctx = ctx;              // plátno, na které se právě kreslí
    let fx = [];                 // kosmetické částice (nemají vliv na hru)
    let ghostHist = [];          // stopy panáčka pro fialové "glitch" kopie
    let bolts = [];              // blesky zelené výbavy
    let boltFrame = -99;

    function newSim() {
      const lv0 = levelAt(START_T / 60);
      sim = {
        t: START_T, px: W / 2, dir: 1, runTick: 0, idle: 99,
        drops: [], spawnIn: 30, dead: false, lv: lv0, lastLv: lv0,
        curtainIn: 200, marks: [], wait: [],
        edgeT: 0, edgeSide: 0, punch: null, knockLeft: 0, knockDir: 0
      };
      rng = mulberry32(hashString('fonger-dodge-240-' + week));
      pend = 0;
    }
    newSim();

    /* ================= SIMULACE (pevný krok 60 Hz) ================= */

    function levelAt(sec) {
      let lv = 0;
      for (let i = 1; i < LEVELS.length; i++) if (sec >= LEVELS[i].from) lv = i;
      return lv;
    }

    function curveAt(sec) {
      for (let i = 1; i < CURVE.length; i++) {
        if (sec < CURVE[i][0]) {
          const a = CURVE[i - 1], b = CURVE[i], k = (sec - a[0]) / (b[0] - a[0]);
          return { interval: a[1] + (b[1] - a[1]) * k, speed: (a[2] + (b[2] - a[2]) * k) * FALL_SCALE };
        }
      }
      const z = CURVE[CURVE.length - 1];
      return { interval: z[1], speed: z[2] * FALL_SCALE };
    }

    // Vybere druh věci podle vah úrovně (náhoda ze semínka)
    function pickKind(list) {
      let total = 0;
      for (let i = 0; i < list.length; i++) total += list[i][1];
      let r = rng() * total;
      for (let i = 0; i < list.length; i++) {
        r -= list[i][1];
        if (r < 0) return list[i][0];
      }
      return list[0][0];
    }

    // Vítr: plynule se mění z jedné strany na druhou (cyklus asi 25 s) a k tomu rychlejší nárazy
    function windAt(t, amp) {
      return amp ? (Math.sin(t / 240) + Math.sin(t / 77) * 0.35) * amp / 1.35 : 0;
    }

    // Přidá jednu věc: kapku, vlnící se kapku, kroupu, salvu, míč, ledovou kapku nebo meteor
    function spawnOne(s, cv) {
      const L = LEVELS[s.lv];
      const kind = pickKind(L.kinds);
      const pal = L.pals ? L.pals[Math.floor(rng() * L.pals.length)] : L.pal;

      if (kind === 'meteor') {
        const x = 12 + rng() * (W - 24);
        const big = rng() < 0.3;
        const vy = cv.speed * 0.9 + 0.5 + rng() * 0.6 - (big ? 0.2 : 0);
        let dir = rng() < 0.5 ? -1 : 1;
        if (x < W * 0.3) dir = 1; else if (x > W * 0.7) dir = -1;     // u kraje letí dovnitř
        const vx = dir * (0.4 + rng() * 0.8);
                // varování: meteor se objeví až o 0,75 s později, nahoře zatím bliká značka
        s.wait.push({ at: s.t + 45, drop: { x: x, y: -10, vx: vx, vy: vy, r: big ? 4.5 : 3, m: true, big: big, pal: pal } });
      } else if (kind === 'zig') {
        // vlnící se kapka: padá po sinusovce, takže se nedá odhadnout podle prvního pohledu
        const amp = 12 + rng() * 8;
        const x0 = amp + 8 + rng() * (W - 2 * amp - 16);
        s.drops.push({ x: x0, y: -10, vx: 0, vy: cv.speed * 0.8 + rng() * 0.3, r: 4, m: false, z: true, x0: x0, amp: amp, ph: rng() * 6.28, fq: 0.035 + rng() * 0.02, w: false, pal: pal });
      } else if (kind === 'volley') {
        // salva kroupy: tři kroupy šikmo za sebou po jedné čáře
        const dir = rng() < 0.5 ? -1 : 1;
        const x = clamp(W / 2 - dir * (30 + rng() * 40), 14, W - 14);
        const vy = cv.speed * 1.35 + rng() * 0.4;
        for (let i = 0; i < 3; i++) {
          s.drops.push({ x: x + dir * i * 11, y: -8 - i * 11 * (vy / 0.55), vx: dir * 0.55, vy: vy, r: 2, m: false, h: true, w: false, pal: pal });
        }
      } else if (kind === 'bounce') {
        // míč: po dopadu se odrazí zpátky nahoru a ještě jednou
        const dir = rng() < 0.5 ? -1 : 1;
        const x = clamp(W / 2 - dir * (20 + rng() * 55), 12, W - 12);
        s.drops.push({ x: x, y: -10, vx: dir * (0.5 + rng() * 0.6), vy: cv.speed * 0.6, r: 4, m: false, b: true, bounces: 0, w: false, pal: pal });
      } else if (kind === 'hail') {
        const x = 6 + rng() * (W - 12);
        s.drops.push({ x: x, y: -8, vx: 0, vy: cv.speed * 1.5 + rng() * 0.8, r: 2, m: false, h: true, w: true, pal: pal });
      } else if (kind === 'ice') {
        const x = 24 + rng() * (W - 48);
        s.drops.push({ x: x, y: -10, vx: 0, vy: cv.speed * 0.8 + rng() * 0.4, r: 4, m: false, ice: true, splitY: 70 + rng() * 70, w: true, pal: pal });
      } else {
        const x = 6 + rng() * (W - 12);
        const size = rng() < 0.2 ? 2 : (rng() < 0.5 ? 1 : 0);
        const speed = cv.speed + rng() * 0.7;
        s.drops.push({ x: x, y: -8, vx: 0, vy: speed, r: R[size], m: false, w: true, pal: pal });
      }
    }

    // Záclona: řada kapek přes celé hřiště s jednou mezerou
    function spawnCurtain(s, cv) {
      const L = LEVELS[s.lv];
      const gx = 28 + rng() * (W - 56);
      const pal = L.pals ? L.pals[Math.floor(rng() * L.pals.length)] : L.pal;
      const vy = cv.speed * 0.85;
      const tilt = rng() < 0.5 ? -1 : 1;                       // šikmá vlna: jedna strana dopadne dřív
      for (let x = 6; x <= W - 6; x += 12) {
        if (Math.abs(x - gx) < 17) continue;
        const off = L.slope ? (tilt > 0 ? x : W - x) * 0.4 : 0;
        s.drops.push({ x: x, y: -8 - off, vx: 0, vy: vy, r: 3, m: false, w: false, pal: pal });
      }
      s.marks.push({ x: gx, t: s.t });
      s.spawnIn = Math.max(s.spawnIn, 100);        // během záclony chvíli žádný další déšť, ať je mezera opravdu volná
    }

    // Ledová kapka se v půlce pádu rozlomí na 3 střepy
    function shatter(s, d) {
      const vxs = [-0.9, 0, 0.9];
      for (let i = 0; i < 3; i++) {
        s.drops.push({ x: d.x, y: d.y, vx: vxs[i], vy: d.vy * 0.9, r: 2, m: false, h: true, w: true, pal: d.pal });
      }
      for (let i = 0; i < 10; i++) {
        fx.push({ x: d.x, y: d.y, vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3, life: 0.8, c: '#ffffff', g: 0 });
      }
    }

    // Boxerka: kdo stojí u zdi, po 5 s dostane pěstí a odletí ke středu (bez zranění)
    function stepGlove(s) {
      const side = s.px < EDGE_ZONE ? -1 : (s.px > W - EDGE_ZONE ? 1 : 0);

      if (side && !s.punch) {
        if (s.edgeSide !== side) { s.edgeSide = side; s.edgeT = 0; }
        s.edgeT++;
      } else if (s.edgeT > 0) {
        s.edgeT = Math.max(0, s.edgeT - 1.5);
      }

      if (s.edgeT >= EDGE_PUNCH && !s.punch) {
        s.punch = { side: s.edgeSide, t: 0 };
        s.edgeT = 0;
      }

      if (s.punch) {
        s.punch.t++;
        if (s.punch.t === 5) {
          const dist = s.punch.side < 0 ? s.px : W - s.px;
          if (dist < PUNCH_REACH) {
            s.knockLeft = PUNCH_PUSH;
            s.knockDir = -s.punch.side;
            pend = 0;
            if (!reduceMotion) shakeUntil = performance.now() + 220;
            if (navigator.vibrate) navigator.vibrate(30);
            const wx = s.punch.side < 0 ? 0 : W;
            for (let i = 0; i < 12; i++) {
              fx.push({ x: wx, y: GROUND - 12, vx: -s.punch.side * (1 + Math.random() * 2.2), vy: -1.5 + Math.random() * 1.2, life: 1, c: i % 2 ? '#ffd0d6' : '#ff5a6e', g: 0.1 });
            }
          }
        }
        if (s.punch.t > 17) s.punch = null;
      }
    }

    function stepSim() {
      const s = sim;
      s.t++;

      // pohyb panáčka: vlastní pohyb a případné odsunutí boxerkou
      let move = 0;
      if (keys.left) move -= MAXSTEP;
      if (keys.right) move += MAXSTEP;
      if (!move && Math.abs(pend) > 0.01) {
        // tažení prstem/myší: panáček ujede přesně to, co prst, a nic nedojíždí
        move = clamp(pend, -TOUCH_MAX, TOUCH_MAX);
        pend = 0;
      }
      let kb = 0;
      if (s.knockLeft > 0) {
        kb = Math.min(s.knockLeft, 4);
        s.knockLeft -= kb;
        kb *= s.knockDir;
      }
      s.px = clamp(s.px + move + kb, 7, W - 7);
      const mv = move || kb;
      if (mv) {
        s.dir = mv > 0 ? 1 : -1;
        s.idle = 0;
        s.runTick++;
        if (s.runTick % 7 === 0) puff(s.px - s.dir * 4, GROUND);
      } else {
        s.idle++;
      }

      stepGlove(s);

      // úroveň a nové kapky: všechna náhoda závisí jen na semínku, ne na hráči
      const sec = s.t / 60;
      s.lv = levelAt(sec);
      const L = LEVELS[s.lv];
      if (s.lv !== s.lastLv) { s.lastLv = s.lv; s.curtainIn = 200; }

      s.spawnIn--;
      if (s.spawnIn <= 0) {
        const cv = curveAt(sec);
        const burstN = rng() < Math.min(0.30, sec / 300) ? 2 : 1;
        for (let b = 0; b < burstN; b++) spawnOne(s, cv);
        const calm = (s.lv > 0 && s.t - L.from * 60 < 180) ? 1.8 : 1;       // první 3 s nové úrovně jsou klidnější
        s.spawnIn = cv.interval * WIDTH_SCALE * calm * L.thin * (0.6 + rng() * 0.8);
      }

      if (L.curtain) {
        s.curtainIn--;
        if (s.curtainIn <= 0) {
          spawnCurtain(s, curveAt(sec));
          s.curtainIn = L.curtain + rng() * 120;
        }
      }
      while (s.marks.length && s.t - s.marks[0].t > 190) s.marks.shift();
      for (let i = s.wait.length - 1; i >= 0; i--) {
        if (s.t >= s.wait[i].at) { s.drops.push(s.wait[i].drop); s.wait.splice(i, 1); }
      }

      // pohyb kapek a zásahy (kolize se počítá vždy z malého panáčka, výbava ji nemění)
      const wind = windAt(s.t, L.wind);
      for (let i = s.drops.length - 1; i >= 0; i--) {
        const d = s.drops[i];
        if (d.b) d.vy += 0.05;                               // míč: gravitace
        d.y += d.vy;
        if (d.z) d.x = d.x0 + Math.sin(d.ph + d.y * d.fq) * d.amp;
        else d.x += d.vx + (d.w ? wind : 0);
        if (d.b && (d.x < 6 || d.x > W - 6)) { d.vx = -d.vx; d.x = clamp(d.x, 6, W - 6); }

        const r = d.r * 0.85;
        const cx = clamp(d.x, s.px - 3.5, s.px + 3.5);
        const cy = clamp(d.y, GROUND - 19, GROUND);
        const dx = d.x - cx, dy = d.y - cy;
        if (dx * dx + dy * dy < r * r) {
          die();
          return;
        }

        if (d.ice && d.y >= d.splitY) {
          s.drops.splice(i, 1);
          shatter(s, d);
          continue;
        }

        if (d.b && d.y + d.r >= GROUND && d.bounces < 2) {
          d.bounces++;
          d.y = GROUND - d.r;
          d.vy = -Math.abs(d.vy) * 0.68;
          splashGround(Object.assign({}, d, { r: 2 }));
          continue;
        }

        if (d.y + d.r >= GROUND) {
          splashGround(d);
          s.drops.splice(i, 1);
        }
      }
    }

    /* ================= KOSMETICKÉ EFEKTY ================= */

    function puff(x, y) {
      for (let i = 0; i < 2; i++) {
        fx.push({ x: x, y: y - 1, vx: (Math.random() - 0.5) * 0.6, vy: -0.2 - Math.random() * 0.3, life: 1, c: '#4a5374', g: 0 });
      }
    }

    function splashGround(d) {
      const cols = d.m ? ['#ffd27a', '#ff8a2a', '#c8321a'] : [d.pal.body, d.pal.edge];
      const n = d.m ? (d.big ? 14 : 9) : 4 + (d.r - 2) * 2;
      for (let i = 0; i < n; i++) {
        fx.push({
          x: d.x, y: GROUND - 1,
          vx: (Math.random() - 0.5) * (d.m ? 3.2 : 2.4),
          vy: -1 - Math.random() * (d.m ? 2.4 : 1.6),
          life: 1, c: cols[Math.floor(Math.random() * cols.length)], g: 0.12
        });
      }
    }

    function burst(x, y) {
      for (let i = 0; i < 26; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 0.8 + Math.random() * 2.4;
        fx.push({ x: x, y: y - 8, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, life: 1.4, c: Math.random() < 0.5 ? '#e8eef9' : '#9fb0d0', g: 0.1 });
      }
    }

    function updateFx(dt) {
      const k = dt * 60;
      for (let i = fx.length - 1; i >= 0; i--) {
        const p = fx[i];
        p.vy += p.g * k;
        p.x += p.vx * k;
        p.y += p.vy * k;
        p.life -= 0.03 * k;
        if (p.life <= 0 || p.y > H) fx.splice(i, 1);
      }
    }
        /* ================= KRESLENÍ ================= */

    // Pozadí každé úrovně se nakreslí jednou
    function paintBackground(L, seed) {
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const b = c.getContext('2d');
      const g = b.createLinearGradient(0, 0, 0, GROUND);
      g.addColorStop(0, L.sky[0]);
      g.addColorStop(1, L.sky[1]);
      b.fillStyle = g;
      b.fillRect(0, 0, W, H);
      const r = mulberry32(seed);
      const stars = Math.round(46 * W / 180);
      for (let i = 0; i < stars; i++) {
        const x = Math.floor(r() * W), y = Math.floor(r() * (GROUND - 10));
        b.fillStyle = r() < 0.2 ? L.stars[1] : L.stars[0];
        b.fillRect(x, y, 1, 1);
      }
      b.fillStyle = L.line;
      b.fillRect(0, GROUND, W, 1);
      for (let y = GROUND + 1; y < H; y += 4) {
        for (let x = 0; x < W; x += 8) {
          b.fillStyle = ((x / 8 + (y - GROUND) / 4) % 2 === 0) ? L.tile[0] : L.tile[1];
          b.fillRect(x, y, 8, 4);
        }
      }
      return c;
    }

    const BGS = LEVELS.map((L, i) => paintBackground(L, 1234 + i * 77));

    function px(x, y, w, h, c) {
      dctx.fillStyle = c;
      dctx.fillRect(Math.round(x), Math.round(y), w, h);
    }

    // Kapka: ocásek nahoře, tělo, tmavší okraj vpravo dole a odlesk
    function drawRain(d) {
      const r = d.r, p = d.pal;
      const cx = Math.round(d.x), cy = Math.round(d.y);
      for (let i = 1; i <= r * 2; i++) {
        const hw = Math.floor(r * (1 - i / (r * 2)));
        px(cx - hw, cy - r - i, hw * 2 + 1, 1, p.body);
      }
      for (let dy = -r; dy <= r; dy++) {
        const hw = Math.floor(Math.sqrt(r * r - dy * dy + 0.5));
        px(cx - hw, cy + dy, hw * 2 + 1, 1, p.body);
        if (dy >= -1) px(cx + hw, cy + dy, 1, 1, p.edge);
      }
      px(cx - Math.ceil(r / 2), cy - Math.ceil(r / 2), 1, 1, p.hi);
    }

    // Meteor: svítící hlava a ocas, který se táhne šikmo za ním
    function drawMeteor(d) {
      const len = d.big ? 24 : 17;
      const slope = d.vx / d.vy;
      dctx.save();
      for (let i = len; i >= 1; i--) {
        const k = i / len;                                    // 1 = konec ocasu, 0 = hlava
        dctx.globalAlpha = (1 - k) * 0.85;
        const w = Math.max(1, Math.round(d.r * 2 * (1 - k * 0.75)));
        const col = k < 0.35 ? '#ffb04a' : (k < 0.7 ? '#ff5a1e' : '#b32a14');
        px(d.x - i * slope - w / 2, d.y - i, w, 1, col);
      }
      dctx.restore();

      dctx.save();
      dctx.shadowColor = '#ff6a1e';
      dctx.shadowBlur = 6;
      const r = d.r, cx = Math.round(d.x), cy = Math.round(d.y);
      for (let dy = -r - 1; dy <= r + 1; dy++) {                // tmavý okraj
        const hw = Math.floor(Math.sqrt((r + 1) * (r + 1) - dy * dy + 0.5));
        px(cx - hw, cy + dy, hw * 2 + 1, 1, '#a8260f');
      }
      for (let dy = -r; dy <= r; dy++) {                        // oranžové tělo
        const hw = Math.floor(Math.sqrt(r * r - dy * dy + 0.5));
        px(cx - hw, cy + dy, hw * 2 + 1, 1, '#ff8a2a');
      }
      const c = Math.max(1, Math.round(r * 0.5));               // žhavé jádro
      px(cx - c + 1, cy - c + 1, c, c, '#ffe9a8');
      dctx.restore();
    }
        // Vlnící se kapka: kulatý slizký flek s bublinkami za sebou
    function drawBlob(d) {
      const p = d.pal, r = d.r, cx = Math.round(d.x), cy = Math.round(d.y);
      for (let dy = -r - 1; dy <= r + 1; dy++) {
        const hw = Math.floor(Math.sqrt((r + 1) * (r + 1) - dy * dy + 0.5));
        px(cx - hw, cy + dy, hw * 2 + 1, 1, p.edge);
      }
      for (let dy = -r; dy <= r; dy++) {
        const hw = Math.floor(Math.sqrt(r * r - dy * dy + 0.5));
        px(cx - hw, cy + dy, hw * 2 + 1, 1, p.body);
      }
      px(cx - 2, cy - 2, 2, 2, p.hi);
      px(cx + 1, cy + 1, 1, 1, p.edge);
      const trail = Math.sin(d.ph + d.y * d.fq);
      px(cx - Math.round(trail * 3), cy - r - 3, 2, 2, p.body);          // bublinky za ním
      px(cx - Math.round(trail * 5), cy - r - 7, 1, 1, p.body);
    }

    // Míč: kulatý s pruhem, před dopadem se trochu zploští
    function drawBall(d) {
      const p = d.pal, r = d.r, cx = Math.round(d.x), cy = Math.round(d.y);
      const squash = d.vy > 0 && d.y > GROUND - r - 6 ? 1 : 0;
      for (let dy = -r + squash; dy <= r; dy++) {
        const hw = Math.floor(Math.sqrt((r + 1) * (r + 1) - dy * dy + 0.5)) + (squash ? 1 : 0);
        px(cx - hw, cy + dy, hw * 2 + 1, 1, p.edge);
      }
      for (let dy = -r + 1 + squash; dy <= r - 1; dy++) {
        const hw = Math.floor(Math.sqrt(r * r - dy * dy + 0.5)) + (squash ? 1 : 0);
        px(cx - hw, cy + dy, hw * 2 + 1, 1, p.body);
      }
      px(cx - 2, cy - 2, 2, 1, p.hi);
      px(cx - r + 1, cy, r * 2 - 1, 1, p.edge);                          // pruh
    }

    // Kroupa: malá ledová kulička s krátkou stopou
    function drawHail(d) {
      const p = d.pal, cx = Math.round(d.x), cy = Math.round(d.y);
      dctx.save();
      dctx.globalAlpha = 0.35;
      px(cx, cy - 7, 1, 5, p.hi);
      dctx.restore();
      px(cx - 1, cy - 1, 3, 3, p.body);
      px(cx + 1, cy, 1, 2, p.edge);
      px(cx, cy + 1, 2, 1, p.edge);
      px(cx - 1, cy - 1, 1, 1, p.hi);
    }

    // Ledová kapka: před rozlomením bliká do bíla
    const FLASH_PAL = { body: '#ffffff', edge: '#bfeaff', hi: '#ffffff' };
    function drawIce(d) {
      const flash = d.y > d.splitY - 26 && (sim.t % 6 < 3);
      drawRain(flash ? Object.assign({}, d, { pal: FLASH_PAL }) : d);
    }

    // Záře kolem kapky (ve tmě v úrovni Blackout)
    function drawHalo(d) {
      const col = d.m ? '255,140,60' : '210,225,255';
      const g = dctx.createRadialGradient(d.x, d.y, 1, d.x, d.y, 11);
      g.addColorStop(0, 'rgba(' + col + ',0.38)');
      g.addColorStop(1, 'rgba(' + col + ',0)');
      dctx.fillStyle = g;
      dctx.fillRect(d.x - 11, d.y - 11, 22, 22);
    }

    function drawDrop(d) {
      if (LEVELS[bgLv].glow) drawHalo(d);
      if (d.m) drawMeteor(d);
      else if (d.h) drawHail(d);
      else if (d.ice) drawIce(d);
      else if (d.z) drawBlob(d);
      else if (d.b) drawBall(d);
      else drawRain(d);
    }

    // Záclona: zlatý sloupec světla ukazuje, kde je mezera
    // Meteor se ohlašuje: nahoře bliká vykřičník se šipkou ve směru letu
    function drawWarns() {
      if (!((frameCount >> 2) & 1)) return;
      sim.wait.forEach(function (w) {
        const x = Math.round(w.drop.x), dir = w.drop.vx > 0 ? 1 : -1;
        px(x - 1, 3, 3, 7, '#ff5a1e');
        px(x - 1, 12, 3, 3, '#ff5a1e');
        px(x + dir * 5, 6, 2, 2, '#ffb04a');
        px(x + dir * 8, 6, 2, 2, '#ffb04a');
      });
    }

    // Záclona: zlatý sloupec světla svítí, dokud záclona nedopadne
    function drawMarks() {
      sim.marks.forEach(function (m) {
        const a = Math.max(0, Math.min(1, (190 - (sim.t - m.t)) / 40)) * 0.4;
        const g = dctx.createLinearGradient(0, 0, 0, GROUND);
        g.addColorStop(0, 'rgba(255,212,90,' + a.toFixed(3) + ')');
        g.addColorStop(1, 'rgba(255,212,90,' + (a * 0.3).toFixed(3) + ')');
        dctx.fillStyle = g;
        dctx.fillRect(Math.round(m.x) - 17, 0, 34, GROUND);
      });
    }

    // Blackout: světelná kaluž kolem panáčka
    function drawLightPool(x) {
      const g = ctx.createRadialGradient(x, GROUND - 6, 4, x, GROUND - 6, 80);
      g.addColorStop(0, 'rgba(210,210,255,0.22)');
      g.addColorStop(1, 'rgba(210,210,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - 80, GROUND - 86, 160, 100);
    }

    // Boxerka u zdi: kreslí se v souřadnicích levé zdi, pravá je zrcadlově
    function drawGlove(side, ext, shake) {
      const y = GROUND - 17 + (shake ? (frameCount % 2 ? 1 : -1) : 0);
      const X = (x, w) => side < 0 ? x : W - x - w;
      px(X(0, Math.max(0, ext - 9)), y + 3, Math.max(0, ext - 9), 3, '#8892a8');     // paže
      px(X(ext - 9, 7), y - 4, 7, 5, '#3a0610');                                      // obrys palce
      px(X(ext - 11, 12), y - 1, 12, 11, '#3a0610');                                  // obrys pěsti
      px(X(ext - 8, 5), y - 3, 5, 3, '#ff3b4d');                                      // palec
      px(X(ext - 10, 10), y, 10, 9, '#ff3b4d');                                       // pěst
      px(X(ext - 9, 6), y + 1, 6, 2, '#ff9aa6');                                      // odlesk
      px(X(ext - 14, 4), y + 1, 4, 7, '#f2f4fa');                                     // manžeta
    }

    function drawGloveState() {
      const s = sim;
      if (s.punch) {
        const t = s.punch.t;
        const ext = t <= 5 ? 8 + (PUNCH_REACH + 6 - 8) * t / 5 : (PUNCH_REACH + 6) - (t - 5) * ((PUNCH_REACH - 2) / 12);
        drawGlove(s.punch.side, Math.max(6, ext), false);
      } else if (s.edgeT >= EDGE_WARN) {
        const k = clamp((s.edgeT - EDGE_WARN) / (EDGE_PUNCH - EDGE_WARN), 0, 1);
        const ext = 6 + 8 * k;
        drawGlove(s.edgeSide, ext, true);
        if (s.edgeT > 240 && ((frameCount >> 2) & 1)) {
          px(s.edgeSide < 0 ? ext + 5 : W - ext - 7, GROUND - 32, 2, 6, '#ff3b4d');
          px(s.edgeSide < 0 ? ext + 5 : W - ext - 7, GROUND - 24, 2, 2, '#ff3b4d');
        }
      }
    }

    // Co je vidět na pozadí: aktuální úroveň a plynulý přechod z předchozí
    let bgLv = 0, bgPrev = 0, bgFade = 1, flashUntil = 0;
    let barLv = -1;
    const GROUND_GLOW = { 5: '255,90,20', 9: '255,61,240' };

    function drawBackground() {
      const idle = state === 'menu' || state === 'count';
      const target = idle ? 0 : sim.lv;
      if (idle) { bgLv = 0; bgPrev = 0; bgFade = 1; }
      else if (target !== bgLv) { bgPrev = bgLv; bgLv = target; bgFade = 0; }
      bgFade = Math.min(1, bgFade + 1 / 90);

      if (barLv !== bgLv) {
        barLv = bgLv;
        screenEl.style.setProperty('--bar-top', LEVELS[bgLv].sky[0]);
        screenEl.style.setProperty('--bar-bot', LEVELS[bgLv].tile[0]);
      }

      if (bgFade < 1) {
        ctx.drawImage(BGS[bgPrev], 0, 0);
        ctx.globalAlpha = bgFade;
        ctx.drawImage(BGS[bgLv], 0, 0);
        ctx.globalAlpha = 1;
      } else {
        ctx.drawImage(BGS[bgLv], 0, 0);
      }

      // Storm: občas zablesk
      if (bgLv === 4 && !reduceMotion && state === 'play' && frameCount > flashUntil + 150 && Math.random() < 0.006) flashUntil = frameCount + 7;
      if (frameCount < flashUntil) {
        ctx.fillStyle = ((flashUntil - frameCount) % 3 === 0) ? 'rgba(190,180,255,0.07)' : 'rgba(190,180,255,0.2)';
        ctx.fillRect(0, 0, W, GROUND);
      }

      // Meteors a Void: záře nad zemí
      const glow = GROUND_GLOW[bgLv];
      if (glow) {
        const a = 0.1 + 0.05 * Math.sin(frameCount / 30);
        const g = ctx.createLinearGradient(0, GROUND - 70, 0, GROUND);
        g.addColorStop(0, 'rgba(' + glow + ',0)');
        g.addColorStop(1, 'rgba(' + glow + ',' + a.toFixed(3) + ')');
        ctx.fillStyle = g;
        ctx.fillRect(0, GROUND - 70, W, 70);
      }
    }

    // Panáček se skládá z obdélníků: nejdřív obrys, pak výplň
    const RUN = [
      { l: [-4, 6, 0], r: [1, 4, 2], la: -1, ra: 1 },
      { l: [-2, 5, 0], r: [-1, 5, 0], la: 0, ra: 0 },
      { l: [-4, 4, 2], r: [1, 6, 0], la: 1, ra: -1 },
      { l: [-2, 5, 0], r: [-1, 5, 0], la: 0, ra: 0 }
    ];

    // Barvy: výchozí šedý panáček a čtyři výbavy
    const PAL_DEFAULT = { outline: '#101524', leg: '#6f7fa3', arm: '#9fb0d0', body: '#9fb0d0', head: '#e8eef9', shade: '#6f7fa3', hi: '#ffffff', eye: '#10141f' };

    const GEAR = {
      red: {
        glow: '#ff2d4f', cape: '#e0203f', capeEdge: '#ff8a9a',
        pal: { outline: '#2a0610', leg: '#b8162f', arm: '#ff4d66', body: '#ff4d66', head: '#ffc9d1', shade: '#b8162f', hi: '#ffffff', eye: '#2a0610' }
      },
      purple: {
        glow: '#a855ff', cape: '#8a3df0', capeEdge: '#d6b3ff',
        pal: { outline: '#160a2e', leg: '#6a2fc0', arm: '#b07dff', body: '#b07dff', head: '#e9d9ff', shade: '#6a2fc0', hi: '#ffffff', eye: '#160a2e' }
      },
      green: {
        glow: '#2dff8a', cape: '#16c466', capeEdge: '#a6ffd0',
        pal: { outline: '#06210f', leg: '#10a158', arm: '#4dff9a', body: '#4dff9a', head: '#d4ffe8', shade: '#10a158', hi: '#ffffff', eye: '#06210f' }
      },
      diamond: {
        glow: '#bfe6ff', cape: '#7fc6ff', capeEdge: '#ffffff',
        pal: { outline: '#0e1a33', leg: '#86bff0', arm: '#cfeaff', body: '#cfeaff', head: '#f4fcff', shade: '#8fc0f0', hi: '#ffffff', eye: '#0e1a33' }
      }
    };

    // Kterou výbavu má mít panáček ve hře
    function activeGear() {
      if (gearParam) return GEAR[gearParam] ? gearParam : null;
      return gearOf(myStatus);
    }

    function drawPlayer(x, base, frame, dir, blink, pal) {
      pal = pal || PAL_DEFAULT;
      const f = frame < 0 ? { l: [-3, 6, 0], r: [0, 6, 0], la: 0, ra: 0 } : RUN[frame];
      const rect = (dx, dy, w, h, c, grow) => {
        const g = grow ? 1 : 0;
        const left = dir > 0 ? x + dx - g : x - dx - w - g;
        px(left, base + dy - g, w + g * 2, h + g * 2, c);
      };

      const parts = [
        { dx: f.l[0], dy: -(f.l[1] + f.l[2]), w: 3, h: f.l[1], c: pal.leg },          // levá noha
        { dx: f.r[0], dy: -(f.r[1] + f.r[2]), w: 3, h: f.r[1], c: pal.leg },          // pravá noha
        { dx: -5, dy: -12 + f.la, w: 2, h: 5, c: pal.arm },                            // levá ruka
        { dx: 3, dy: -12 + f.ra, w: 2, h: 5, c: pal.arm },                             // pravá ruka
        { dx: -3, dy: -12, w: 6, h: 6, c: pal.body },                                  // tělo
        { dx: -3, dy: -20, w: 6, h: 9, c: pal.head },                                  // hlava (svisle)
        { dx: -4, dy: -19, w: 8, h: 7, c: pal.head }                                   // hlava (vodorovně)
      ];

      parts.forEach(p => rect(p.dx, p.dy, p.w, p.h, pal.outline, true));   // obrys
      parts.forEach(p => rect(p.dx, p.dy, p.w, p.h, p.c, false));          // výplň

      rect(1, -12, 2, 6, pal.shade, false);                                 // stín na těle
      rect(-3, -19, 2, 1, pal.hi, false);                                   // odlesk na hlavě
      if (blink) {
        rect(-1, -16, 2, 1, pal.eye, false);
        rect(2, -16, 2, 1, pal.eye, false);
      } else {
        rect(-1, -17, 2, 3, pal.eye, false);
        rect(2, -17, 2, 3, pal.eye, false);
      }
    }

    /* ---------- Výbava ---------- */

    // Plášť: za panáčkem vlaje, při běhu se natahuje dozadu
    function drawCape(x, base, dir, moving, gr) {
      const len = moving ? 9 : 4;
      for (let i = 0; i < len; i++) {
        const wave = Math.sin(frameCount / 4 + i * 0.9) * (moving ? 1.8 : 0.5);
        const top = base - 12 + (moving ? i * 0.4 : i * 0.2) + wave;
        const h = Math.max(2, Math.round((moving ? 7 : 8) - i * (moving ? 0.55 : 1.2)));
        const cx = dir > 0 ? x - 3 - i : x + 2 + i;
        px(cx, top, 1, h, gr.cape);
        px(cx, top, 1, 1, gr.capeEdge);          // světlá horní hrana
      }
    }

    // Diamant: paprsek světla shora
    function drawRay(x, base) {
      const top = Math.max(0, base - 120);
      const bottom = base - 24;
      const grad = dctx.createLinearGradient(0, top, 0, bottom);
      grad.addColorStop(0, 'rgba(190,230,255,0)');
      grad.addColorStop(1, 'rgba(190,230,255,0.25)');
      const hue = (frameCount * 3) % 360;
      dctx.save();
      dctx.fillStyle = grad;
      dctx.beginPath();
      dctx.moveTo(x - 2, top);
      dctx.lineTo(x + 2, top);
      dctx.lineTo(x + 9, bottom);
      dctx.lineTo(x - 9, bottom);
      dctx.closePath();
      dctx.fill();
      dctx.lineWidth = 1;
      dctx.strokeStyle = 'hsla(' + hue + ',90%,75%,0.4)';
      dctx.beginPath(); dctx.moveTo(x - 2, top); dctx.lineTo(x - 9, bottom); dctx.stroke();
      dctx.strokeStyle = 'hsla(' + ((hue + 180) % 360) + ',90%,75%,0.4)';
      dctx.beginPath(); dctx.moveTo(x + 2, top); dctx.lineTo(x + 9, bottom); dctx.stroke();
      dctx.restore();
    }

    // Diamant: zlatá koruna
    function drawCrown(x, base) {
      dctx.save();
      dctx.shadowColor = '#ffd34d';
      dctx.shadowBlur = 5;
      px(x - 3, base - 23, 7, 2, '#ffd34d');       // pás
      px(x - 3, base - 26, 1, 3, '#ffd34d');       // hroty
      px(x,     base - 27, 1, 4, '#ffd34d');
      px(x + 3, base - 26, 1, 3, '#ffd34d');
      px(x - 3, base - 23, 7, 1, '#fff2a8');       // světlejší horní hrana
