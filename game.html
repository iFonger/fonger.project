      px(x,     base - 22, 1, 1, '#ff4d66');       // drahokam
      dctx.restore();
    }

    // Červená: plamenný kroužek nad hlavou
    function drawFlameRing(x, base) {
      const t = frameCount;
      const pulse = 1 + Math.sin(t / 9) * 0.12;
      dctx.save();
      dctx.shadowColor = '#ff2d4f';
      dctx.shadowBlur = 6;
      for (let i = 0; i < 14; i++) {
        const a = i / 14 * Math.PI * 2 + t * 0.05;
        const fxp = x + Math.cos(a) * 7 * pulse;
        const fyp = base - 29 + Math.sin(a) * 2.2;
        const h = 2 + Math.round((Math.sin(t * 0.35 + i * 1.7) + 1) * 1.6);
        px(fxp, fyp - h, 1, h, '#ff2d4f');
        px(fxp, fyp - h, 1, Math.min(h, 2), '#ffb03c');    // žhavé špičky
      }
      dctx.restore();
    }

    // Fialová: tři kuličky obíhají kolem těla
    function drawOrbs(x, base) {
      const t = frameCount;
      dctx.save();
      dctx.shadowColor = '#a855ff';
      dctx.shadowBlur = 6;
      for (let i = 0; i < 3; i++) {
        const a = t * 0.07 + i * Math.PI * 2 / 3;
        const ox = x + Math.cos(a) * 11;
        const oy = base - 12 + Math.sin(a) * 5;
        px(ox - 1, oy - 1, 3, 3, '#d9b8ff');
        px(ox, oy, 1, 1, '#ffffff');
      }
      dctx.restore();
    }

    // Fialová: zpožděné "glitch" kopie při běhu
    function drawGhosts(base, pal) {
      [[7, 0.38], [14, 0.2]].forEach(function (gh) {
        const h = ghostHist[ghostHist.length - 1 - gh[0]];
        if (!h) return;
        dctx.save();
        dctx.globalAlpha = gh[1];
        drawPlayer(h.x + (Math.random() < 0.3 ? 2 : 0), base, h.fr, h.dir, false, pal);
        dctx.restore();
      });
    }

    // Fialová: když stojí, občas se na okamžik "rozsype" na kopie
    function drawGlitchIdle(x, base, pal, frame, dir) {
      const ph = frameCount % 110;
      if (ph > 9) return;
      const off = ph % 2 ? 3 : -3;
      dctx.save();
      dctx.globalAlpha = 0.35;
      drawPlayer(x + off, base, frame, dir, false, pal);
      dctx.globalAlpha = 0.2;
      drawPlayer(x - off * 2, base, frame, dir, false, pal);
      dctx.restore();
    }

    // Zelená: dvě antény na hlavě a blesky
    function drawAntennas(x, base) {
      const on = (frameCount % 20) < 14;
      dctx.save();
      dctx.shadowColor = '#2dff8a';
      dctx.shadowBlur = 6;
      px(x - 3, base - 26, 1, 5, '#16c466');
      px(x + 3, base - 26, 1, 5, '#16c466');
      px(x - 4, base - 28, 3, 2, on ? '#eafff2' : '#2dff8a');
      px(x + 2, base - 28, 3, 2, on ? '#2dff8a' : '#eafff2');
      dctx.restore();
    }

    function makeBolt(x0, y0, x1, y1) {
      const pts = [[x0, y0]];
      const n = 4;
      for (let i = 1; i < n; i++) {
        pts.push([
          x0 + (x1 - x0) * i / n + (Math.random() - 0.5) * 5,
          y0 + (y1 - y0) * i / n + (Math.random() - 0.5) * 5
        ]);
      }
      pts.push([x1, y1]);
      return pts;
    }

    function drawArcs(x, base) {
      if (frameCount - boltFrame >= 3) {
        boltFrame = frameCount;
        bolts = [makeBolt(-3, -28, 3, -28)];                    // mezi anténami
        if (Math.random() < 0.6) {                              // a občas z těla do strany
          const a = Math.random() * Math.PI * 2;
          bolts.push(makeBolt(0, -12, Math.cos(a) * 12, -12 + Math.sin(a) * 9));
        }
      }
      dctx.save();
      dctx.shadowColor = '#2dff8a';
      dctx.shadowBlur = 5;
      dctx.strokeStyle = '#d6ffe8';
      dctx.lineWidth = 1;
      bolts.forEach(function (pts) {
        dctx.beginPath();
        pts.forEach(function (p, i) {
          const X = Math.round(x + p[0]) + 0.5, Y = Math.round(base + p[1]) + 0.5;
          if (i === 0) dctx.moveTo(X, Y); else dctx.lineTo(X, Y);
        });
        dctx.stroke();
      });
      dctx.restore();
    }

    // Panáček s výbavou
    function drawGear(x, base, frame, dir, blink, name, moving) {
      const gr = GEAR[name];
      const pal = Object.assign({}, gr.pal);

      if (name === 'diamond') {
        // duhové odlesky: barva těla a rukou pomalu přebíhá celou duhou
        const hue = (frameCount * 3) % 360;
        pal.body = 'hsl(' + hue + ',90%,84%)';
        pal.arm = 'hsl(' + ((hue + 60) % 360) + ',90%,84%)';
        drawRay(x, base);
      }
      if (name === 'purple') {
        if (moving) drawGhosts(base, pal);
        else drawGlitchIdle(x, base, pal, frame, dir);
      }

      dctx.save();
      dctx.shadowColor = gr.glow;
      dctx.shadowBlur = 6;
      if (name === 'diamond') dctx.globalAlpha = 0.93;
      drawCape(x, base, dir, moving, gr);
      drawPlayer(x, base, frame, dir, blink, pal);
      dctx.restore();

      if (name === 'diamond') drawCrown(x, base);
      if (name === 'red') drawFlameRing(x, base);
      if (name === 'purple') drawOrbs(x, base);
      if (name === 'green') { drawAntennas(x, base); drawArcs(x, base); }
    }

    function drawAvatar(x, base, frame, dir, blink, name, moving) {
      if (name) drawGear(x, base, frame, dir, blink, name, moving);
      else drawPlayer(x, base, frame, dir, blink);
    }

    // Jiskry a stopy okolo panáčka (jen vzhled, nikdy nepadají dolů)
    function gearFx(x, base, name, moving, dir) {
      const r = Math.random;
      if (name === 'red') {
        if (r() < 0.5) fx.push({ x: x - dir * 4, y: base - 10 - r() * 6, vx: -dir * (0.2 + r() * 0.4), vy: -0.5 - r() * 0.6, life: 0.9, c: r() < 0.5 ? '#ff2d4f' : '#ffb03c', g: -0.01 });
        if (moving && r() < 0.8) fx.push({ x: x - dir * 4, y: base - 1 - r() * 6, vx: -dir * 0.3, vy: -0.05, life: 0.8, c: '#ff2d4f', g: 0 });
      }
      if (name === 'diamond' && r() < 0.35) {
        const a = r() * Math.PI * 2;
        fx.push({ x: x + Math.cos(a) * 12, y: base - 12 + Math.sin(a) * 14, vx: 0, vy: -0.15, life: 0.9, c: r() < 0.5 ? '#ffffff' : '#bfe6ff', g: 0 });
      }
      if (name === 'green' && r() < 0.2) {
        fx.push({ x: x + (r() - 0.5) * 14, y: base - 8 - r() * 14, vx: 0, vy: -0.1, life: 0.7, c: '#9affc6', g: 0 });
      }
    }

    function drawSplat(x, pal) {
      pal = pal || PAL_DEFAULT;
      px(x - 8, GROUND - 3, 16, 3, pal.outline);
      px(x - 7, GROUND - 3, 14, 2, pal.leg);
      px(x - 6, GROUND - 5, 12, 3, pal.arm);
      px(x - 2, GROUND - 7, 4, 3, pal.head);
    }

    function drawFx() {
      fx.forEach(p => {
        px(p.x, p.y, 1, 1, p.c);
        if (p.life > 0.7) px(p.x + 1, p.y, 1, 1, p.c);
      });
    }

    function draw() {
      frameCount++;
      drawBackground();

      const blink = (frameCount % 200) < 8;
      const gear = activeGear();
      const pal = gear ? GEAR[gear].pal : PAL_DEFAULT;

      if (state === 'menu' || state === 'count') {
        ghostHist.length = 0;
        drawAvatar(W / 2, GROUND, -1, 1, blink, gear, false);
        if (gear) gearFx(W / 2, GROUND, gear, false, 1);
      } else if (sim) {
        if (LEVELS[bgLv].glow && !sim.dead) drawLightPool(sim.px);
        drawMarks();
        drawMarks();
        sim.drops.forEach(drawDrop);
        if (sim.dead) {
          drawSplat(sim.px, pal);
        } else {
          const moving = sim.idle < 3;
          const fr = moving ? Math.floor(sim.runTick / 5) % 4 : -1;
          if (gear === 'purple') {
            ghostHist.push({ x: sim.px, dir: sim.dir, fr: fr });
            if (ghostHist.length > 20) ghostHist.shift();
          }
          drawAvatar(sim.px, GROUND, fr, sim.dir, blink, gear, moving);
          if (gear && state !== 'paused') gearFx(sim.px, GROUND, gear, moving, sim.dir);
          drawGloveState();
        }
      }

      drawFx();
    }

    /* ---------- Malí panáčci v tabuli ---------- */

    const MINI = 48;          // velikost malého plátna (v herních pixelech)
    let minis = [];           // panáčci, kteří se právě kreslí v tabuli

    // Dočasně přepne kreslení na jinou scénu (jiné plátno, jiné částice a efekty)
    function withStage(st, fn) {
      const prev = { dctx: dctx, fx: fx, ghostHist: ghostHist, bolts: bolts, boltFrame: boltFrame };
      dctx = st.ctx; fx = st.fx; ghostHist = st.ghost; bolts = st.bolts; boltFrame = st.boltFrame;
      try {
        fn();
      } finally {
        st.bolts = bolts; st.boltFrame = boltFrame;
        dctx = prev.dctx; fx = prev.fx; ghostHist = prev.ghostHist; bolts = prev.bolts; boltFrame = prev.boltFrame;
      }
    }

    function makeMini(gear) {
      const c = document.createElement('canvas');
      c.className = 'av';
      c.width = MINI;
      c.height = MINI;
      minis.push({
        ctx: c.getContext('2d'), gear: gear,
        fx: [], ghost: [], bolts: [], boltFrame: -99,
        off: Math.floor(Math.random() * 200)
      });
      return c;
    }

    function drawMini(m) {
      withStage(m, function () {
        dctx.clearRect(0, 0, MINI, MINI);
        const blink = ((frameCount + m.off) % 200) < 8;
        const x = MINI / 2, base = MINI - 6;
        drawAvatar(x, base, -1, 1, blink, m.gear, false);
        if (m.gear) gearFx(x, base, m.gear, false, 1);
        updateFx(frameDt);
        drawFx();
      });
    }
        /* ================= PRŮBĚH HRY ================= */

    function show(id) {
      ['ovStart', 'ovCount', 'ovPause', 'ovOver'].forEach(k => $(k).classList.toggle('show', k === id));
    }

    function bestKey() { return 'fonger-best-' + week; }

    function loadBest() {
      bestMs = parseInt(localStorage.getItem(bestKey()) || '0', 10) || 0;
      $('bestEl').textContent = bestMs ? 'BEST ' + (bestMs / 1000).toFixed(2) : '';
    }

    function startCountdown() {
      week = currentWeek();                       // týden se určí na začátku kola
      $('weekLine').textContent = 'WEEK ' + week;
      loadBest();
      newSim();
      fx.length = 0;
      ghostHist.length = 0;
      state = 'count';
      $('timeEl').textContent = '0.00';
      show('ovCount');

      const token = ++countToken;
      let n = 3;
      $('countNum').textContent = n;
      const tick = () => {
        if (state !== 'count' || token !== countToken) return;
        n--;
        if (n > 0) {
          $('countNum').textContent = n;
          setTimeout(tick, 650);
        } else {
          show(null);
          state = 'play';
          acc = 0;
          last = performance.now();
        }
      };
      setTimeout(tick, 650);
    }

    function cancelCountdown() {
      countToken++;
      state = 'menu';
      show('ovStart');
    }

    function die() {
      sim.dead = true;
      state = 'over';
      const ms = Math.round(sim.t * 1000 / 60);
      sim.finalMs = ms;
      $('lvlBanner').classList.remove('go');
      burst(sim.px, GROUND);
      if (!reduceMotion) shakeUntil = performance.now() + 260;
      if (navigator.vibrate) navigator.vibrate(60);

      let note = '';
      if (START_T) {
        note = 'Test run: not saved';
      } else if (ms > bestMs) {
        note = bestMs ? 'New personal best' : 'First run this week';
        bestMs = ms;
        localStorage.setItem(bestKey(), String(ms));
      } else {
        note = 'Your best: ' + (bestMs / 1000).toFixed(2) + ' s';
      }

      setTimeout(() => {
        if (state !== 'over') return;
        $('overTime').textContent = (ms / 1000).toFixed(2) + ' s';
        $('overNote').textContent = note;
        $('submitMsg').textContent = '';
        $('btnSubmit').disabled = false;
        $('nameInput').disabled = false;
        $('nameForm').style.display = 'flex';
        $('nameInput').value = localStorage.getItem('fonger-name') || '';
        $('overLvl').textContent = 'LEVEL ' + (sim.lv + 1) + ' · ' + LEVELS[sim.lv].name.toUpperCase();
        $('overLvl').style.color = LEVELS[sim.lv].accent;
        if (START_T) $('nameForm').style.display = 'none';
        show('ovOver');
        // na počítači rovnou do políčka, na telefonu ne (ať nevyskočí klávesnice)
        if (finePointer && mode === 'game' && !START_T) {
          try { $('nameInput').focus({ preventScroll: true }); } catch (e) {}
        }
      }, 700);
    }

    function pauseGame() {
      if (state !== 'play') return;
      state = 'paused';
      show('ovPause');
    }

    function resumeGame() {
      if (state !== 'paused') return;
      show(null);
      state = 'play';
      acc = 0;
      last = performance.now();
    }

    // Celoobrazovkový režim: na dotykových zařízeních (nebo zkušebně s ?fs=1)
    const fsMq = window.matchMedia('(pointer: coarse) and (max-width: 900px)');
    function enterFs() { if (fsMq.matches || query.get('fs')) document.body.classList.add('fs'); }
    function exitFs() { document.body.classList.remove('fs'); }

    // Křížek: zpátky na úvodní obrazovku automatu
    function exitToMenu() {
      countToken++;
      state = 'menu';
      exitFs();
      show('ovStart');
      $('timeEl').textContent = '0.00';
    }

    // Společný vstup pro páku, tlačítko START a klávesnici
    function startRound() {
      if (mode !== 'game') setMode('game');
      if (state === 'paused') { resumeGame(); return; }
      if (state === 'count' || state === 'play') return;
      if (document.activeElement && document.activeElement.tagName === 'INPUT') document.activeElement.blur();
      enterFs();
      startCountdown();
    }

    /* ================= ÚROVNĚ: štítek a nápis při změně ================= */

    let shownLv = -1;
    let windTxt = '';

    function syncLevel() {
      if (state === 'menu' || state === 'count') {
        if (shownLv !== -1) { shownLv = -1; $('lvlEl').textContent = ''; }
        if (windTxt) { windTxt = ''; $('windEl').textContent = ''; }
        return;
      }
      if (state === 'over') return;

      // šipky větru pod štítkem úrovně
      const L0 = LEVELS[sim.lv];
      let wt = '';
      if (L0.wind) {
        const k = clamp(windAt(sim.t, L0.wind) / L0.wind, -1, 1);   // -1 až 1;           // -1 až 1
        const n = 1 + Math.floor(Math.abs(k) * 2.99);
        wt = Math.abs(k) < 0.15 ? 'WIND ·' : (k > 0 ? 'WIND ' + '›'.repeat(n) : '‹'.repeat(n) + ' WIND');
      }
      if (wt !== windTxt) { windTxt = wt; $('windEl').textContent = wt; }

      if (sim.lv === shownLv) return;

      shownLv = sim.lv;
      const L = LEVELS[shownLv];
      const label = $('lvlEl');
      label.textContent = 'LEVEL ' + (shownLv + 1) + ' · ' + L.name.toUpperCase();
      label.style.setProperty('--lc', L.accent);

      if (reduceMotion) return;
      const banner = $('lvlBanner');
      $('lvlBannerNum').textContent = 'LEVEL ' + (shownLv + 1);
      $('lvlBannerName').textContent = L.name.toUpperCase();
      $('lvlBannerHint').textContent = L.hint || '';
      banner.style.setProperty('--lc', L.accent);
      banner.classList.remove('go');
      void banner.offsetWidth;                 // vynutí překreslení, aby se animace spustila znovu
      banner.classList.add('go');
    }

    /* ================= SMYČKA ================= */

    let acc = 0;
    let last = performance.now();

    function frame(now) {
      const dtMs = Math.min(100, now - last);
      last = now;
      frameDt = dtMs / 1000;

      if (state === 'play') {
        acc += dtMs;
        while (acc >= STEP_MS) {
          stepSim();
          acc -= STEP_MS;
          if (state !== 'play') break;
        }
        $('timeEl').textContent = (sim.t / 60).toFixed(2);
      }

      updateFx(frameDt);
      draw();
      syncLevel();
      music.setActive(state === 'play' || state === 'count');
      if (mode === 'score') minis.forEach(drawMini);
      if (mode === 'rules') ruleMinis.forEach(drawMini);

      // zatřesení obrazovky při zásahu
      if (now < shakeUntil) {
        const m = (shakeUntil - now) / 260 * 4;
        screenEl.style.transform = 'translate(' + ((Math.random() - 0.5) * m).toFixed(1) + 'px,' + ((Math.random() - 0.5) * m).toFixed(1) + 'px)';
      } else if (screenEl.style.transform) {
        screenEl.style.transform = '';
      }

      requestAnimationFrame(frame);
    }

    /* ================= PŘEPÍNAČ GAME / SCORE / RULES ================= */

    const MODES = ['game', 'score', 'rules'];
    const switchEl = $('switch');

    function setMode(m) {
      if (m === mode) return;

      // při odchodu z hry se hra zastaví
      if (mode === 'game') {
        if (state === 'play') pauseGame();
        else if (state === 'count') cancelCountdown();
      }

      mode = m;
      screenEl.dataset.mode = m;
      $('paneGame').classList.toggle('show', m === 'game');
      $('paneScore').classList.toggle('show', m === 'score');
      $('paneRules').classList.toggle('show', m === 'rules');

      switchEl.style.setProperty('--i', MODES.indexOf(m));
      switchEl.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));

      if (m === 'score') refreshBoards();
    }

    switchEl.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => setMode(b.dataset.mode));
    });

    /* ================= OVLÁDÁNÍ HRY ================= */

    let dragging = false;
    let lastX = 0;

    paneGame.addEventListener('pointerdown', e => {
      if (e.target.closest('button, input, form')) return;
      dragging = true;
      lastX = e.clientX;
      try { paneGame.setPointerCapture(e.pointerId); } catch (err) {}
    });

    paneGame.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      lastX = e.clientX;
      if (state === 'play') {
        pend = clamp(pend + dx * (W / cvs.clientWidth) * GAIN, -40, 40);
      }
    });

    const stopDrag = () => { dragging = false; pend = 0; };
    paneGame.addEventListener('pointerup', stopDrag);
    paneGame.addEventListener('pointercancel', stopDrag);

    // Klepnutí na úvodní obrazovku hru také spustí
    $('ovStart').addEventListener('click', startRound);

    window.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;

      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { keys.left = true; e.preventDefault(); }
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keys.right = true; e.preventDefault(); }

      if (e.key === '1' || e.key === '2' || e.key === '3') { setMode(MODES[parseInt(e.key, 10) - 1]); return; }

      if (e.key === ' ' || e.key === 'Enter') {
        // když je zaměřená páka nebo tlačítko, obslouží se samo
        if (e.target.closest && e.target.closest('button, #lever')) return;
        startRound();
        e.preventDefault();
      }
      if (e.key === 'Escape') pauseGame();
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    });

    document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
    window.addEventListener('blur', pauseGame);

    $('btnResume').addEventListener('click', resumeGame);
    $('btnStart').addEventListener('click', startRound);
    $('btnExit').addEventListener('click', exitToMenu);
    $('btnAgain').addEventListener('click', startRound);

    /* ================= PÁKA ================= */

    const lever = $('lever');
    const knob = $('leverKnob');
    const rod = $('leverRod');
    let TRAVEL = 66;              // o kolik pixelů se koule posune nahoru a dolů (škáluje se s velikostí)
    let leverT = -1;              // -1 = nahoře, 1 = úplně dole
    let leverDrag = false;
    let leverMoved = 0;
    let leverFired = false;
    let leverAnim = 0;

    function updateTravel() { TRAVEL = lever.clientHeight * 0.33; }

    function renderLever(t) {
      leverT = t;
      const pivot = lever.clientHeight / 2;
      const y = pivot + t * TRAVEL;
      knob.style.top = (y - knob.offsetHeight / 2) + 'px';
      knob.style.transform = 'scale(' + (1 + (t + 1) * 0.07).toFixed(3) + ')';
      rod.style.top = Math.min(pivot, y) + 'px';
      rod.style.height = Math.max(4, Math.abs(y - pivot)) + 'px';
    }

    // Plynulý pohyb páky z jedné polohy do druhé
    function tweenLever(to, ms, easing, done) {
      cancelAnimationFrame(leverAnim);
      const from = leverT;
      const t0 = performance.now();
      const step = now => {
        const k = clamp((now - t0) / ms, 0, 1);
        renderLever(from + (to - from) * easing(k));
        if (k < 1) leverAnim = requestAnimationFrame(step);
        else if (done) done();
      };
      leverAnim = requestAnimationFrame(step);
    }

    const easeOut = k => 1 - Math.pow(1 - k, 3);
    const easeBack = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };

    function fireLever() {
      if (leverFired) return;
      leverFired = true;
      if (navigator.vibrate) navigator.vibrate(30);
      startRound();
    }

    function releaseLever() {
      tweenLever(-1, 520, easeBack, () => { leverFired = false; });
    }

    lever.addEventListener('pointerdown', e => {
      leverDrag = true;
      leverMoved = 0;
      cancelAnimationFrame(leverAnim);
      lever.classList.add('grab');
      try { lever.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });

    lever.addEventListener('pointermove', e => {
      if (!leverDrag) return;
      const r = lever.getBoundingClientRect();
      const pivotY = r.top + r.height / 2;
      const t = clamp((e.clientY - pivotY) / TRAVEL, -1, 1);
      leverMoved = Math.max(leverMoved, Math.abs(t + 1) * TRAVEL);
      renderLever(t);
      if (t >= 0.9) fireLever();
    });

    const endLeverDrag = () => {
      if (!leverDrag) return;
      leverDrag = false;
      lever.classList.remove('grab');
      if (leverMoved < 8 && !leverFired) {
        // jen klepnutí: páka se stáhne sama
        tweenLever(1, 170, easeOut, () => { fireLever(); releaseLever(); });
      } else {
        releaseLever();
      }
    };

    lever.addEventListener('pointerup', endLeverDrag);
    lever.addEventListener('pointercancel', endLeverDrag);

    lever.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (leverFired || leverDrag) return;
        tweenLever(1, 170, easeOut, () => { fireLever(); releaseLever(); });
      }
    });

    updateTravel();
    renderLever(-1);
    window.addEventListener('resize', () => { updateTravel(); renderLever(leverT); });

    /* ================= ŽEBŘÍČEK ================= */

    // Zkontroluje přezdívku: povolené znaky, délka a zakázaná slova
    function cleanName(raw) {
      const name = raw.replace(/[^\p{L}\p{N} _.\-]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 14);
      const flat = name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z]/g, '');
      if (!name) return { ok: false, msg: 'Type a name first.' };
      if (BLOCKED.some(w => flat.includes(w))) return { ok: false, msg: 'Pick another name.' };
      return { ok: true, name: name };
    }

    // Ukázkový režim: skóre jen v tomto zařízení
    const LOCAL_KEY = 'fonger-local-scores';
    function localAll() {
      try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]'); } catch (e) { return []; }
    }

    function localBoards(cur, prev) {
      const all = localAll();
      const byTime = (a, b) => b.time_ms - a.time_ms;
      return {
        cur: all.filter(r => r.week === cur).sort(byTime).slice(0, 10),
        prev: all.filter(r => r.week === prev).sort(byTime).slice(0, 3),
        best: all.slice().sort(byTime).slice(0, 1)
      };
    }

    // Vymyšlená data na zkoušení vzhledu tabule (?demo=board nebo ?demo=champ)
    function demoBoards() {
      const names = ['Nova', 'Pixel', 'Glitch', 'Ember', 'Static', 'Mochi', 'Drift', 'Orbit', 'Zap', 'Pebble'];
      const champOnPodium = DEMO === 'champ';
      const cur = names.map((n, i) => ({
        name: n,
        time_ms: Math.round((52 - i * 4.1) * 1000),
        me: i === 5,
        champ: champOnPodium && i === 0
      }));
      return {
        cur: cur,
        prev: [
          { name: 'Orbit', time_ms: 48200 },
          { name: 'Nova', time_ms: 44900 },
          { name: 'Zap', time_ms: 40100 }
        ],
        best: [{ name: champOnPodium ? 'Nova' : 'Legend', time_ms: 99000, champ: true }],
        me: { rank: 6, time_ms: cur[5].time_ms, champ: false }
      };
    }

    // Načte všechny tři žebříčky najednou
    async function fetchBoards(cur, prev) {
      if (!REMOTE) return localBoards(cur, prev);
      const res = await fetch(API_URL + '?week=' + encodeURIComponent(cur) + '&prev=' + encodeURIComponent(prev) + '&pid=' + encodeURIComponent(PLAYER_ID));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    // Uloží výsledek a vrátí pořadí v týdnu
    async function saveScore(name, ms, wk) {
      if (!REMOTE) {
        const all = localAll();
        all.push({ name: name, time_ms: ms, week: wk });
        localStorage.setItem(LOCAL_KEY, JSON.stringify(all.slice(-200)));
        return { rank: all.filter(r => r.week === wk && r.time_ms > ms).length + 1, champ: false };
      }
      // Bez hlavičky Content-Type se pošle jako obyčejný text, takže prohlížeč nepotřebuje předběžné povolení (CORS)
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ name: name, time_ms: ms, week: wk, player_id: PLAYER_ID })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'rejected');
      return { rank: data.rank, champ: !!data.champ };
    }

    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;   // textContent: jména se nikdy nevkládají jako HTML
      return n;
    }

    const PODIUM_GEARS = ['red', 'purple', 'green'];
    const fmtTime = ms => (ms / 1000).toFixed(2) + ' s';

    // Je tenhle řádek můj? (server značí me, v ukázkovém režimu se porovná jméno a čas)
    function isMine(e) {
      return !!e.me || !!(lastSubmitted && e.name === lastSubmitted.name && e.time_ms === lastSubmitted.ms);
    }

    function boardRow(rank, e) {
      const li = el('li', 'row' + (isMine(e) ? ' me' : ''));
      li.appendChild(el('span', 'rank', String(rank)));
      li.appendChild(el('span', 'name', e.name));
      li.appendChild(el('span', 'time', fmtTime(e.time_ms)));
      return li;
    }

    function nameWithBadge(cls, e) {
      const box = el('div', cls);
      box.appendChild(el('span', 'pn', e.name));
      if (isMine(e)) box.appendChild(el('span', 'you', 'YOU'));
      return box;
    }

    // Vykreslí celou tabuli: pódium, místa 4-10, minulý týden a nejlepšího za celou dobu
    function renderBoards(data) {
      minis = [];
      const cur = data.cur || [];

      // Pódium: 2. místo vlevo, 1. uprostřed, 3. vpravo
      const podium = $('podium');
      podium.textContent = '';
      [1, 0, 2].forEach(i => {
        const e = cur[i];
        const g = e ? (e.champ ? 'diamond' : PODIUM_GEARS[i]) : null;
        const col = el('div', 'pod pod-' + (i + 1) + (g ? ' g-' + g : ' empty'));
        if (e) {
          col.appendChild(makeMini(g));
          col.appendChild(nameWithBadge('pname', e));
          col.appendChild(el('div', 'ptime', fmtTime(e.time_ms)));
        }
        const block = el('div', 'pblock');
        block.appendChild(el('span', 'pnum', String(i + 1)));
        col.appendChild(block);
        podium.appendChild(col);
      });

      const empty = $('curEmpty');
      empty.textContent = 'No scores yet. Be the first!';
      empty.hidden = cur.length > 0;

      // Místa 4 až 10
      const rest = $('listRest');
      rest.textContent = '';
      for (let i = 3; i < Math.min(cur.length, 10); i++) rest.appendChild(boardRow(i + 1, cur[i]));

      // Když jsem mimo top 10, ukáže se moje pořadí pod seznamem
      const you = $('youRow');
      you.textContent = '';
      if (data.me && data.me.rank && data.me.rank > 10 && data.me.time_ms) {
        const gap = el('li', 'row gap', '…');
        gap.style.gridTemplateColumns = '1fr';
        you.appendChild(gap);
        let myName = 'You';
        try { myName = localStorage.getItem('fonger-name') || 'You'; } catch (err) {}
        you.appendChild(boardRow('#' + data.me.rank, { name: myName, time_ms: data.me.time_ms, me: true }));
      }

      // Minulý týden: stejné barvy, ale tlumeně
      const prev = $('listPrev');
      prev.textContent = '';
      const pv = data.prev || [];
      if (!pv.length) {
        prev.appendChild(el('li', 'row empty', 'No scores last week.'));
      } else {
        pv.forEach((e, i) => {
          const li = el('li', 'prow g-' + PODIUM_GEARS[i]);
          li.appendChild(el('span', 'dot'));
          li.appendChild(el('span', 'rank', '#' + (i + 1)));
          li.appendChild(el('span', 'name', e.name));
          li.appendChild(el('span', 'time', fmtTime(e.time_ms)));
          prev.appendChild(li);
        });
      }

      // Nejlepší za celou dobu: diamantová karta
      const at = $('allTime');
      at.textContent = '';
      const b = (data.best || [])[0];
      if (b) {
        at.className = 'alltime g-diamond';
        at.appendChild(makeMini('diamond'));
        const info = el('div', 'ainfo');
        info.appendChild(el('div', 'alabel', 'ALL-TIME #1'));
        info.appendChild(nameWithBadge('aname', b));
        info.appendChild(el('div', 'atime', fmtTime(b.time_ms)));
        at.appendChild(info);
      } else {
        at.className = 'alltime';
        at.appendChild(el('div', 'empty-note', 'No scores yet.'));
      }
    }

    let boardToken = 0;

    async function refreshBoards() {
      const token = ++boardToken;
      const cur = currentWeek();
      const prev = previousWeek();
      $('curWeek').textContent = cur;
      $('weekLine').textContent = 'WEEK ' + cur;
      $('boardNote').textContent = DEMO
        ? 'Demo data: this is not the real leaderboard.'
        : REMOTE
          ? 'A new level starts every Monday at 00:00 (Prague time).'
          : 'Demo mode: scores are saved only on this device. Add your web app URL at the top of game.html to share them with everyone.';

      try {
        const data = DEMO ? demoBoards() : await fetchBoards(cur, prev);
        if (token !== boardToken) return;                // mezitím přišla novější žádost
        if (!DEMO && data.me) {
          myStatus = { rank: data.me.rank, champ: !!data.me.champ };
          updateStatusLine();
        }
        renderBoards(data);
      } catch (err) {
        if (token !== boardToken) return;
        renderBoards({ cur: [], prev: [], best: [] });
        $('curEmpty').textContent = 'Could not load the leaderboard.';
        $('curEmpty').hidden = false;
      }
    }

    $('nameForm').addEventListener('submit', async e => {
      e.preventDefault();
      if (state !== 'over' || !sim || !sim.finalMs) return;

      const res = cleanName($('nameInput').value);
      if (!res.ok) { $('submitMsg').textContent = res.msg; return; }

      $('btnSubmit').disabled = true;
      $('nameInput').disabled = true;
      $('submitMsg').textContent = 'Saving…';

      try {
        const saved = await saveScore(res.name, sim.finalMs, week);
        const rank = saved.rank;
        localStorage.setItem('fonger-name', res.name);
        lastSubmitted = { name: res.name, ms: sim.finalMs };
        $('submitMsg').textContent = rank ? 'Saved! You are #' + rank + ' this week.' : 'Saved!';
        $('nameForm').style.display = 'none';
        refreshBoards();
      } catch (err) {
        $('submitMsg').textContent = 'Could not save. Try again.';
        $('btnSubmit').disabled = false;
        $('nameInput').disabled = false;
      }
    });

    /* ================= ÚVOD: WELCOME TO THE GAME ================= */

    const introEl = $('intro');
    const phraseEl = $('phrase');
    const machineEl = $('machine');
    const INTRO_KEY = 'fonger-intro-day';
    const root = document.documentElement;

    function finishIntro() {
      if (introEl.parentNode) introEl.remove();
      root.classList.remove('intro-on');
      try { localStorage.setItem(INTRO_KEY, todayKey()); } catch (e) {}
    }

    function runIntro() {
      root.classList.add('intro-on');
      const timers = [];
      const at = (fn, ms) => timers.push(setTimeout(fn, ms));
      const words = Array.prototype.slice.call(phraseEl.children);

      words.forEach((w, i) => at(() => w.classList.add('on'), 250 + i * INTRO_WORD_GAP));

      const hopAt = 250 + words.length * INTRO_WORD_GAP + INTRO_HOLD;
      at(() => { introEl.classList.add('hop1'); machineEl.classList.add('rise'); }, hopAt);
      at(() => { introEl.classList.remove('hop1'); introEl.classList.add('hop2'); }, hopAt + 650);
      at(finishIntro, hopAt + 650 + 750);

      // klepnutím nebo klávesou jde úvod přeskočit
      const skip = () => {
        timers.forEach(clearTimeout);
        machineEl.classList.remove('rise');
        machineEl.classList.add('shown');
        finishIntro();
        document.removeEventListener('pointerdown', skip);
        document.removeEventListener('keydown', skip);
      };
      document.addEventListener('pointerdown', skip);
      document.addEventListener('keydown', skip);
    }

    let seenToday = false;
    try { seenToday = localStorage.getItem(INTRO_KEY) === todayKey(); } catch (e) {}

    if (reduceMotion || seenToday) {
      machineEl.classList.add('shown');
      introEl.remove();
    } else {
      runIntro();
    }

    /* ================= PRAVIDLA (RULES) V ANGLIČTINĚ A ČEŠTINĚ ================= */

    // Všechny texty pravidel jsou tady. <b> je tučné písmo. Poznámky k úrovním jdou za sebou jako úrovně.
    const RULES_I18N = {
      en: {
        how: 'HOW TO PLAY',
        goal: 'Survive as long as you can. <b>One hit and you are out.</b>',
        phone: 'Phone', phoneT: 'Drag your finger left and right.',
        pc: 'Computer', pcT: 'Use the keys or drag with the mouse.',
        start: 'Start', startT: 'Pull the lever, press START or hit Space.',
        tip: 'Tip: stay near the middle. Small steps beat long runs.',
        levels: 'LEVELS', levelsP: 'The longer you survive, the wilder it gets.',
        notes: ['calm rain', 'wind pushes the drops', 'blobs wobble left and right', 'rows of drops with one gap', 'diagonal, with a warning',
                'ice shatters in the air', 'tilted waves, stay in the gap', 'you see only what shines', 'wind, waves, ice and lightning', 'everything at once'],
        edges: "DON'T HIDE IN THE CORNER",
        edgesP: 'Stay by a wall for <b>5 seconds</b> and a glove punches you back to the middle. It does not hurt, but you lose your spot.',
        week: 'WEEKLY BOARD',
        weekP: 'Every week has its own level, <b>the same for everyone</b>. Only your best time of the week counts. A new week starts on Monday at 00:00 Prague time.',
        gear: 'GEAR',
        gearP: 'The top 3 of the week get glowing gear until Monday. The best player of all time wears diamond for good.',
        caps: ['1st', '2nd', '3rd', 'ALL-TIME']
      },
      cz: {
        how: 'JAK HRÁT',
        goal: 'Přežij co nejdéle. <b>Jeden zásah a končíš.</b>',
        phone: 'Telefon', phoneT: 'Táhni prstem doleva a doprava.',
        pc: 'Počítač', pcT: 'Používej šipky nebo táhni myší.',
        start: 'Start', startT: 'Zatáhni za páku, stiskni START nebo mezerník.',
        tip: 'Tip: drž se spíš uprostřed. Malé kroky jsou lepší než dlouhé běhy.',
        levels: 'ÚROVNĚ', levelsP: 'Čím déle přežiješ, tím je to divočejší.',
        notes: ['klidný déšť', 'vítr tlačí kapky', 'kapky se vlní ze strany na stranu', 'řady kapek s jednou mezerou', 'šikmé, s varováním',
                'led se ve vzduchu rozbije', 'šikmé vlny, drž se v mezeře', 'vidíš jen to, co svítí', 'vítr, vlny, led a blesky', 'všechno najednou'],
        edges: 'NESCHOVÁVEJ SE V ROHU',
        edgesP: 'Když zůstaneš u zdi <b>5 sekund</b>, rukavice tě odrazí zpátky do středu. Nebolí to, ale přijdeš o pozici.',
        week: 'TÝDENNÍ ŽEBŘÍČEK',
        weekP: 'Každý týden má vlastní úroveň, <b>stejnou pro všechny</b>. Počítá se jen tvůj nejlepší čas týdne. Nový týden začíná v pondělí v 00:00 pražského času.',
        gear: 'VÝBAVA',
        gearP: 'Top 3 hráči týdne dostanou svítící výbavu do pondělí. Nejlepší hráč všech dob nosí diamant napořád.',
        caps: ['1.', '2.', '3.', 'VŠECH DOB']
      }
    };

    const LANG_KEY = 'fonger-lang';
    let lang = 'en';
    try {
      const saved = localStorage.getItem(LANG_KEY);
      if (saved === 'en' || saved === 'cz') lang = saved;
      else if (/^(cs|sk)/i.test(navigator.language || '')) lang = 'cz';   // Češi a Slováci dostanou češtinu sami
    } catch (e) {}

    let ruleMinis = [];           // animovaní panáčci v části GEAR

    function clock(sec) {
      return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    }

    // Malé plátno, na které se nakreslí obrázek stejnými funkcemi, jakými se kreslí hra
    function iconCanvas(w, h, draw) {
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      c.className = 'ico';
      const st = { ctx: c.getContext('2d'), fx: [], ghost: [], bolts: [], boltFrame: -99 };
      withStage(st, function () { draw(dctx); });
      return c;
    }

    // Pozadí malého obrázku v barvách úrovně a čára země
    function iconSky(g, w, h, L, ground) {
      const gr = g.createLinearGradient(0, 0, 0, ground);
      gr.addColorStop(0, L.sky[0]);
      gr.addColorStop(1, L.sky[1]);
      g.fillStyle = gr;
      g.fillRect(0, 0, w, h);
      g.fillStyle = L.line;
      g.fillRect(0, ground, w, 1);
      g.fillStyle = L.tile[0];
      g.fillRect(0, ground + 1, w, h - ground - 1);
    }

    // Obrázek ke každé úrovni: to, co ji dělá jinou
    function levelIcon(i) {
      const L = LEVELS[i], w = 56, h = 40, G = 36;
      const pal = L.pal || L.pals[0];
      const pals = L.pals || [L.pal, L.pal, L.pal, L.pal];
      return iconCanvas(w, h, function (g) {
        iconSky(g, w, h, L, G);
        const rain = (x, y, r, p) => drawRain({ x: x, y: y, r: r, pal: p || pal });
        const gold = (x, top) => {
          const gr = g.createLinearGradient(0, top, 0, G);
          gr.addColorStop(0, 'rgba(255,212,90,0.45)');
          gr.addColorStop(1, 'rgba(255,212,90,0.1)');
          g.fillStyle = gr;
          g.fillRect(x - 8, top, 16, G - top);
        };
        if (i === 0) { rain(16, 14, 3); rain(36, 26, 2); rain(46, 10, 2); }
        else if (i === 1) {
          rain(12, 12, 2); rain(30, 22, 3); rain(44, 12, 2);
          [[6, 28], [14, 31], [24, 34]].forEach(function (c) { px(c[0], c[1], 12, 1, '#a8d8d0'); px(c[0] + 10, c[1] - 1, 1, 3, '#a8d8d0'); px(c[0] + 11, c[1], 1, 1, '#a8d8d0'); });
        }
        else if (i === 2) {
          [[18, 0.5], [38, 2.2]].forEach(function (b, k) {
            const x0 = b[0], ph = b[1], fq = 0.12;
            for (let y = 2; y < 30; y += 3) px(x0 + Math.sin(ph + y * fq) * 8, y, 1, 1, '#2f6a45');
            drawBlob({ x: x0 + Math.sin(ph + (14 + k * 8) * fq) * 8, y: 14 + k * 8, r: 4, pal: pal, ph: ph, fq: fq });
          });
        }
        else if (i === 3) {
          gold(28, 2);
          for (let x = 4; x < w; x += 8) { if (Math.abs(x - 28) < 10) continue; drawRain({ x: x, y: 11, r: 2, pal: pal }); }
        }
        else if (i === 4) {
          px(9, 3, 3, 7, '#ff5a1e'); px(9, 12, 3, 3, '#ff5a1e'); px(14, 6, 2, 2, '#ffb04a'); px(17, 6, 2, 2, '#ffb04a');
          drawMeteor({ x: 36, y: 24, vx: 0.9, vy: 2, r: 3, big: false });
        }
        else if (i === 5) {
          drawRain({ x: 16, y: 14, r: 4, pal: FLASH_PAL });
          [30, 38, 46].forEach(function (x, k) { drawHail({ x: x, y: 24 + (k === 1 ? 4 : 0), pal: pal }); });
        }
        else if (i === 6) {
          gold(30, 2);
          for (let x = 4; x < w; x += 8) { if (Math.abs(x - 30) < 10) continue; drawRain({ x: x, y: 5 + x * 0.35, r: 2, pal: pal }); }
        }
        else if (i === 7) {
          [[14, 12], [32, 22], [46, 10]].forEach(function (p) { drawHalo({ x: p[0], y: p[1], m: false }); drawRain({ x: p[0], y: p[1], r: 2, pal: pal }); });
        }
        else if (i === 8) {
          g.save();
          g.strokeStyle = '#ffd0f0'; g.lineWidth = 1; g.shadowColor = '#ff7ad9'; g.shadowBlur = 4;
          g.beginPath(); g.moveTo(10, 2); g.lineTo(6, 14); g.lineTo(13, 14); g.lineTo(8, 28); g.stroke();
          g.restore();
          drawBlob({ x: 28, y: 14, r: 4, pal: pal, ph: 1, fq: 0.12 });
          drawMeteor({ x: 44, y: 28, vx: 0.8, vy: 2, r: 3, big: false });
        }
        else {
          drawRain({ x: 10, y: 14, r: 3, pal: pals[0] });
          drawBlob({ x: 24, y: 24, r: 4, pal: pals[2], ph: 0, fq: 0.12 });
          drawMeteor({ x: 40, y: 22, vx: 0.8, vy: 2, r: 3, big: false });
          drawHail({ x: 50, y: 12, pal: { body: '#e6eef7', edge: '#8fa3bd', hi: '#ffffff' } });
        }
      });
    }

    // Obrázek k části HOW TO PLAY: panáček, padající kapky a šipky do stran
    function playIcon() {
      const w = 72, h = 56, G = 50, L = LEVELS[0];
      return iconCanvas(w, h, function (g) {
        iconSky(g, w, h, L, G);
        drawRain({ x: 14, y: 12, r: 3, pal: L.pal }); drawRain({ x: 52, y: 20, r: 2, pal: L.pal }); drawRain({ x: 62, y: 8, r: 3, pal: L.pal });
        drawPlayer(36, G, 1, 1, false, PAL_DEFAULT);
        // šipky doleva a doprava: plné trojúhelníčky
        for (let k = 0; k < 5; k++) {
          px(8 + k, 37 - k, 1, 2 * k + 1, '#ffd0e8');
          px(63 - k, 37 - k, 1, 2 * k + 1, '#ffd0e8');
        }
      });
    }

    // Obrázek k části EDGES: rukavice u zdi a panáček před ní
    function edgeIcon() {
      const w = 72, h = 40, G = 36, L = LEVELS[0];
      return iconCanvas(w, h, function (g) {
        iconSky(g, w, h, L, G);
        for (let k = 0; k < 3; k++) { px(56 + k * 4, 18, 2, 1 + k, '#ffd0e8'); }
        g.save();
        g.translate(0, G - GROUND);
        drawPlayer(34, GROUND, -1, 1, false, PAL_DEFAULT);
        drawGlove(-1, 22, false);
        g.restore();
      });
    }

    function renderRules() {
      const T = RULES_I18N[lang];
      const box = $('rulesBox');
      box.textContent = '';
      ruleMinis = [];

      const bar = el('div', 'lang');
      ['en', 'cz'].forEach(function (l) {
        const b = el('button', l === lang ? 'on' : '', l.toUpperCase());
        b.type = 'button';
        b.dataset.lang = l;
        bar.appendChild(b);
      });
      box.appendChild(bar);

      const section = function (title) {
        const s = el('section');
        s.appendChild(el('h2', null, title));
        box.appendChild(s);
        return s;
      };
      const para = function (html) { const p = el('p'); p.innerHTML = html; return p; };
      const key = function (t) { return '<span class="key">' + t + '</span>'; };

      // HOW TO PLAY
      let s = section(T.how);
      const how = el('div', 'how');
      how.appendChild(playIcon());
      const hw = el('div', 'how-t');
      hw.appendChild(para(T.goal));
      s.appendChild(how);
      how.appendChild(hw);
      const ctrl = el('ul', 'ctrl');
      [[T.phone, T.phoneT], [T.pc, T.pcT + '<br>' + key('←') + key('→') + ' ' + key('A') + key('D')], [T.start, T.startT]].forEach(function (c) {
        const li = el('li');
        li.appendChild(el('span', 'ck', c[0]));
        const sp = el('span', 'cv'); sp.innerHTML = c[1];
        li.appendChild(sp);
        ctrl.appendChild(li);
      });
      s.appendChild(ctrl);
      const tip = para(T.tip); tip.className = 'tip'; s.appendChild(tip);

      // LEVELS
      s = section(T.levels);
      s.appendChild(para(T.levelsP));
      const list = el('ul', 'lvs');
      LEVELS.forEach(function (L, i) {
        const li = el('li');
        li.appendChild(levelIcon(i));
        const t = el('div', 'lt');
        const nm = el('div', 'ln', L.name.toUpperCase());
        nm.style.color = L.accent;
        nm.appendChild(el('span', 'ltime', clock(L.from)));
        t.appendChild(nm);
        t.appendChild(el('div', 'lnote', T.notes[i]));
        li.appendChild(t);
        list.appendChild(li);
      });
      s.appendChild(list);

      // THE EDGES
      s = section(T.edges);
      const ed = el('div', 'how');
      ed.appendChild(edgeIcon());
      const et = el('div', 'how-t'); et.appendChild(para(T.edgesP));
      ed.appendChild(et);
      s.appendChild(ed);

      // WEEKLY BOARD
      s = section(T.week);
      s.appendChild(para(T.weekP));

      // GEAR
      s = section(T.gear);
      const gears = el('div', 'gears');
      ['red', 'purple', 'green', 'diamond'].forEach(function (g, i) {
        const cell = el('div', 'gv g-' + g);
        const c = document.createElement('canvas');
        c.width = MINI; c.height = MINI; c.className = 'av';
        ruleMinis.push({ ctx: c.getContext('2d'), gear: g, fx: [], ghost: [], bolts: [], boltFrame: -99, off: i * 37 });
        cell.appendChild(c);
        cell.appendChild(el('div', 'gcap', T.caps[i]));
        gears.appendChild(cell);
      });
      s.appendChild(gears);
      const gp = para(T.gearP); gp.className = 'tip'; s.appendChild(gp);
    }

    $('rulesBox').addEventListener('click', function (e) {
      const b = e.target.closest('button[data-lang]');
      if (!b) return;
      lang = b.dataset.lang;
      try { localStorage.setItem(LANG_KEY, lang); } catch (err) {}
      renderRules();
    });

    renderRules();

    /* ================= HUDBA (lehká smyčka přímo z kódu, bez souborů) ================= */

    const music = (function () {
      const BPM = 88;
      const SIXT = 60 / BPM / 4;                 // délka šestnáctinové noty v sekundách
      const VOLUME = 0.5;                        // celková hlasitost (0 až 1), hudba je jen do pozadí
      const hz = n => 440 * Math.pow(2, (n - 69) / 12);

      // Akordy: Am, F, C, G (každý jeden takt)
      const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
      // Melodie po taktech (čísla not, null = ticho), 16 kroků na takt
      const MELODY = [
        [76, null, null, 72, null, null, 74, null, 72, null, null, null, 69, null, null, null],
        [72, null, null, 69, null, null, 72, null, 74, null, null, null, 72, null, null, null],
        [76, null, null, 79, null, null, 76, null, 74, null, null, null, 72, null, null, null],
        [74, null, null, 71, null, null, 67, null, 71, null, null, null, 74, null, null, null]
      ];
      const ARP = [0, 1, 2, 1];

      let ac = null, master = null, timer = null;
      let muted = false, active = false, step = 0, nextT = 0;
      try { muted = localStorage.getItem('fonger-muted') === '1'; } catch (e) {}

      function ensure() {
        if (ac) return true;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        ac = new AC();
        const filter = ac.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 2600;
        master = ac.createGain();
        master.gain.value = 0;
        master.connect(filter);
        filter.connect(ac.destination);
        return true;
      }

      function note(type, freq, t, dur, vol) {
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.type = type;
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g);
        g.connect(master);
        o.start(t);
        o.stop(t + dur + 0.05);
      }

      function schedule(i, t) {
        const bar = Math.floor(i / 16) % 4;
        const s = i % 16;
        const ch = CHORDS[bar];
        if (s % 8 === 0) note('triangle', hz(ch[0] - 12), t, SIXT * 7, 0.22);                    // basa
        if (s % 2 === 0) note('square', hz(ch[ARP[(s / 2) % 4]] + 12), t, SIXT * 1.6, 0.035);    // jemné arpeggio
        const m = MELODY[bar][s];
        if (m) note('triangle', hz(m), t, SIXT * 3.5, 0.11);                                      // melodie
      }

      function tick() {
        while (nextT < ac.currentTime + 0.25) {
          schedule(step, nextT);
          nextT += SIXT;
          step = (step + 1) % 64;
        }
      }

      function apply() {
        if (!ac) return;
        const on = active && !muted;
        master.gain.cancelScheduledValues(ac.currentTime);
        master.gain.setTargetAtTime(on ? VOLUME : 0, ac.currentTime, 0.25);
        if (on && !timer) {
          if (ac.state === 'suspended') ac.resume();
          nextT = Math.max(nextT, ac.currentTime + 0.05);
          timer = setInterval(tick, 60);
        } else if (!on && timer) {
          clearInterval(timer);
          timer = null;
        }
      }

      // Prohlížeč pustí zvuk až po klepnutí nebo stisku klávesy, tak to hlídáme
      function unlock() {
        if (!ensure()) return;
        if (ac.state === 'suspended') ac.resume();
        apply();
      }
      ['pointerup', 'click', 'keydown', 'touchend'].forEach(ev => document.addEventListener(ev, unlock, { passive: true }));

      // Tlačítko ztlumení v rohu obrazovky
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mute-btn';
      btn.setAttribute('aria-label', 'Music on or off');
      function paintBtn() {
        btn.textContent = muted ? '♪̸' : '♪';
        btn.classList.toggle('off', muted);
      }
      paintBtn();
      btn.addEventListener('pointerdown', e => e.stopPropagation());
      btn.addEventListener('click', () => {
        muted = !muted;
        try { localStorage.setItem('fonger-muted', muted ? '1' : '0'); } catch (e) {}
        paintBtn();
        unlock();
        apply();
      });
      screenEl.appendChild(btn);

      return {
        setActive(v) {
          if (v === active) return;
          active = v;
          apply();
        }
      };
    })();

    /* ================= START ================= */

    $('weekLine').textContent = 'WEEK ' + week;
    loadBest();
    refreshBoards();
    requestAnimationFrame(frame);
  })();
  </script>
