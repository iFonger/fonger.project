<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fonger</title>
  <link rel="stylesheet" href="style.css">
  <link rel="expect" href="#logo" blocking="render">
  <link rel="prefetch" href="soon.html">
  <link rel="prefetch" href="reach.html">
  <link rel="prefetch" href="experience.html">
  <link rel="prefetch" href="game.html">
  <script src="transition.js"></script>
  <style>
    /* Výška písmen */
    :root { --h: clamp(4rem, 17vw, 13rem); }

    body { overflow: hidden; }

    /* ---------- Světelné orby ---------- */
    .orbs {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      animation: fadeIn 3s ease 1.2s both;
    }

    /* Jeden orb: měkká zářící kulička. Vlastnosti mu nastaví skript dole. */
    .orb {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--s);
      height: var(--s);
      margin: calc(var(--s) * -0.5) 0 0 calc(var(--s) * -0.5);
      border-radius: 50%;
      background: radial-gradient(circle, var(--c1) 0%, var(--c2) 30%, transparent 70%);
      opacity: var(--o);
      filter: blur(var(--b));
      will-change: transform, translate, opacity;
      /* Tři nezávislé pohyby: do stran, nahoru a dolů, a pulzování jasu */
      animation:
        floatX var(--t) ease-in-out infinite alternate,
        floatY var(--t2) ease-in-out infinite alternate,
        twinkle var(--k) ease-in-out infinite;
      animation-delay: var(--d), var(--d3), var(--d2);
    }

    /* Pohyb do stran a pohyb nahoru a dolů mají různé délky,
       takže orb pluje po plynulých obloucích, ne po přímce */
    @keyframes floatX {
      from { translate: calc(var(--dx) * -0.5) 0; }
      to   { translate: calc(var(--dx) * 0.5) 0; }
    }

    @keyframes floatY {
      from { transform: translateY(calc(var(--dy) * -0.5)); }
      to   { transform: translateY(calc(var(--dy) * 0.5)); }
    }

    /* Jemné pulzování jasu */
    @keyframes twinkle {
      0%, 100% { opacity: var(--o); }
      50%      { opacity: calc(var(--o) * 0.4); }
    }

    /* ---------- Nápis ---------- */

    /* Všech šest písmen vedle sebe */
    .logo {
      position: relative;
      z-index: 2;
      display: flex;
      gap: calc(var(--h) * 0.12);
    }

    /* Jedno písmeno = jeden odkaz. Při načtení se nafoukne od země. */
    .letter {
      position: relative;
      display: block;
      text-decoration: none;
      outline: none;
      transform-origin: 50% 100%;
      animation: inflate 1.15s ease-out both;
      animation-delay: calc(var(--i) * 150ms);
    }

    @keyframes inflate {
      0%   { opacity: 0; transform: translateY(1.2rem) scale(0.2, 0.05); }
      35%  { opacity: 1; transform: translateY(0) scale(0.8, 1.25); }
      55%  { transform: scale(1.18, 0.88); }
      72%  { transform: scale(0.94, 1.08); }
      86%  { transform: scale(1.04, 0.97); }
      100% { opacity: 1; transform: scale(1, 1); }
    }

    /* Při návratu z podstránky se úvodní animace nepřehrávají znovu */
    html.vt .letter,
    html.vt .frame,
    html.vt .meta,
    html.vt .orbs { animation: none; }

    /* 3D písmeno ve stylu velkého E na stránce Experience:
       červená čelní plocha a za ní šedé drátěné vrstvy do hloubky.
       .tilt se naklání za kurzorem, .stack se pruží (želé). */
           /* Myš reaguje na pevný čtverec písmene (a), ne na natočený tvar: jinak se písmeno "třese" pod kurzorem */
    .tilt, .tilt * { pointer-events: none; }
    .tilt {
      display: block;
      transform-style: preserve-3d;
      transform: perspective(1000px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    }

    .stack {
      position: relative;
      display: block;
      width: calc(var(--h) * 0.7);
      height: var(--h);
      transform-style: preserve-3d;
      transform-origin: 50% 100%;
    }

    .stack svg {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Drátěné vrstvy za písmenem, každá o kus hlouběji a průhlednější */
    .stack svg.w { transform: translateZ(calc(var(--k) * var(--h) * -0.06)); }
    .stack svg.w path {
      fill: rgba(255, 255, 255, 0.012);
      stroke: rgba(205, 205, 214, calc(0.7 - var(--k) * 0.09));
      stroke-width: 1.2px;
      vector-effect: non-scaling-stroke;
    }

    /* Čelní plocha: barevný přechod. Barvu (red / pink / blue) mění atribut data-face. */
    .stack svg.f {
      filter: drop-shadow(0 0 1.1rem rgba(255, 50, 50, 0.38));
      transition: filter 0.3s ease;
    }
    .stack svg.f path {
      fill: url(#fx-red) #b3081a;
      stroke: #ffb4aa;
      stroke-width: 1.4px;
      vector-effect: non-scaling-stroke;
    }
    .letter[data-face="pink"] svg.f path { fill: url(#fx-pink) #ff4fa6; stroke: #ffd6ec; }
    .letter[data-face="blue"] svg.f path { fill: url(#fx-blue) #0b3fb5; stroke: #b9d4ff; }
    .letter[data-face="pink"] svg.f { filter: drop-shadow(0 0 1.1rem rgba(255, 90, 170, 0.5)); }
    .letter[data-face="blue"] svg.f { filter: drop-shadow(0 0 1.1rem rgba(60, 130, 255, 0.5)); }

    /* Barva záře při najetí prozradí, kam písmeno vede */
    .letter { --hov: 255, 60, 60; }
    .letter[data-t="pink"] { --hov: 255, 90, 170; }
    .letter[data-t="blue"] { --hov: 70, 140, 255; }

    .letter:hover svg.f,
    .letter:focus-visible svg.f {
      filter: brightness(1.18) drop-shadow(0 0 1.6rem rgba(var(--hov), 0.7));
    }

    /* Popisek pod písmenem */
    .tag {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 1.5rem;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      white-space: nowrap;
      color: var(--ink);
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.8);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .letter:hover .tag,
    .letter:focus-visible .tag { opacity: 1; color: rgb(var(--hov)); text-shadow: 0 0 14px rgba(var(--hov), 0.55), 0 1px 10px rgba(0, 0, 0, 0.8); }
    .letter[data-t="red"]:hover .tag { color: var(--ink); text-shadow: 0 1px 10px rgba(0, 0, 0, 0.8); }

    /* ---------- Plakátové detaily ---------- */

    /* Tenký rámeček kolem celé stránky */
    .frame {
      position: fixed;
      inset: 16px;
      z-index: 1;
      border: 1px solid rgba(255, 90, 90, 0.16);
      pointer-events: none;
      animation: fadeIn 1.6s ease 1.7s both;
    }

    /* Drobné texty v rozích */
    .meta {
      position: fixed;
      z-index: 2;
      font-size: 0.74rem;
      line-height: 1.55;
      letter-spacing: 0.08em;
      color: rgba(225, 222, 220, 0.5);
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      animation: fadeIn 1.6s ease 1.9s both;
    }

    .meta b {
      display: block;
      font-weight: 600;
      color: rgba(228, 232, 244, 0.88);
    }

    .meta.tl { top: 32px; left: 36px; text-align: left; }
    .meta.tr { top: 32px; right: 36px; text-align: right; }
    .meta.br { bottom: 32px; right: 36px; text-align: right; }

    /* Tečky za "loading the rest" se postupně objevují */
    .dots::after {
      content: "";
      animation: dots 1.8s steps(1) infinite;
    }

    @keyframes dots {
      0%   { content: ""; }
      25%  { content: "."; }
      50%  { content: ".."; }
      75%  { content: "..."; }
    }

    /* Nápověda pod nápisem, ukáže se jen na dotykových zařízeních */
    .hint {
      display: none;
      position: fixed;
      z-index: 2;
      left: 36px;
      bottom: 32px;
      margin: 0;
      font-size: 0.78rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(228, 232, 244, 0.7);
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      animation: fadeIn 1.2s ease 2.6s both, hintPulse 2.8s ease-in-out 3.8s infinite;
    }

    @keyframes hintPulse {
      0%, 100% { opacity: 0.3; }
      50%      { opacity: 0.9; }
    }

    /* Dotyková zařízení: žádné popisky pod písmeny. Popisek se ukáže nad písmenem,
       dokud ho držíš prstem, a písmena G, E, R (která někam vedou) jemně svítí. */
    @media (hover: none) {
      .hint { display: block; }

      .tag {
        top: auto;
        bottom: 100%;
        margin: 0 0 0.9rem;
        font-size: 0.95rem;
        letter-spacing: 0.14em;
        opacity: 0;
        transition: opacity 0.12s ease;
      }

      .letter:active .tag { opacity: 1; }

      .letter:nth-child(n+4)::before {
        content: "";
        position: absolute;
        inset: -22% -34%;
        z-index: -1;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 70, 70, 0.55), rgba(255, 70, 70, 0));
        pointer-events: none;
        opacity: 0;
        animation: breathe 3.2s ease-in-out infinite;
        animation-delay: calc(var(--i) * 350ms + 1.6s);
      }
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.15; transform: scale(0.9); }
      50%      { opacity: 1;    transform: scale(1.08); }
    }

    @media (max-width: 700px) {
      .meta { font-size: 0.66rem; }
      .meta.tl { left: 28px; top: 28px; }
      .meta.tr { right: 28px; top: 28px; }
      .meta.br { right: 28px; bottom: 28px; }
    }

    /* Kdo má vypnuté animace: orby stojí na místě, tečky jsou prostě vidět */
    @media (prefers-reduced-motion: reduce) {
      .dots::after { animation: none; content: "..."; }
      .orb { animation: none !important; }
      .hint { animation: none !important; opacity: 0.6; }
      .letter:nth-child(n+4)::before { animation: none !important; opacity: 0.6; }
    }

    /* Telefon na výšku: písmena jsou velká a jdou schodištěm zleva nahoře doprava dolů */
    @media (max-width: 700px) and (orientation: portrait) {
      :root {
        --h: min(26vw, 12vh);
        --dx: calc((82vw - var(--h) * 0.7) / 5);     /* o kolik je každé další písmeno víc vpravo */
      }

      .logo {
        flex-direction: column;
        align-items: flex-start;
        width: 82vw;
        gap: calc(var(--h) * 0.1);
      }

      .letter { margin-left: calc(var(--i) * var(--dx)); }

      .hint { left: 28px; bottom: 28px; }
    }
  </style>
</head>

<body>
  <!-- Světelné orby: vytvoří je skript dole -->
  <div class="orbs" id="orbs" aria-hidden="true"></div>

  <!-- Rámeček a drobné texty v rozích. Texty se vyplňují skriptem dole. -->
  <div class="frame" aria-hidden="true"></div>

  <div class="meta tl"><b id="greet">Hello</b></div>
  <div class="meta tr"><b>Local time</b><span id="clock">--:--</span></div>
  <div class="meta br"><b>Level <span id="level">26</span></b>loading the rest<span class="dots"></span></div>

  <!-- Tvar každého písmene je v atributu d. Drátěné vrstvy za ním přidá skript dole.
       data-t = barva cílové stránky (red / pink / blue) -->
  <nav class="logo" id="logo" aria-label="Hlavní menu">
    <a class="letter" style="--i: 0" href="soon.html" data-t="red" data-face="red" aria-label="F, Soon">
      <span class="tilt"><span class="stack"><svg class="f" viewBox="0 0 70 100"><path fill-rule="evenodd" d="M0 0H70V20H20V40H58V60H20V100H0Z"/></svg></span></span>
      <span class="tag">Soon</span>
    </a>

    <a class="letter" style="--i: 1" href="soon.html" data-t="red" data-face="red" aria-label="O, Soon">
      <span class="tilt"><span class="stack"><svg class="f" viewBox="0 0 70 100"><path fill-rule="evenodd" d="M0 50A35 50 0 1 1 70 50A35 50 0 1 1 0 50ZM20 50A15 30 0 1 0 50 50A15 30 0 1 0 20 50Z"/></svg></span></span>
      <span class="tag">Soon</span>
    </a>

    <a class="letter" style="--i: 2" href="soon.html" data-t="red" data-face="red" aria-label="N, Soon">
      <span class="tilt"><span class="stack"><svg class="f" viewBox="0 0 70 100"><path fill-rule="evenodd" d="M0 0H20L50 60V0H70V100H50L20 40V100H0Z"/></svg></span></span>
      <span class="tag">Soon</span>
    </a>

    <a class="letter" style="--i: 3" href="game.html" data-t="pink" data-face="red" aria-label="G, Game">
      <span class="tilt"><span class="stack"><svg class="f" viewBox="0 0 70 100"><path fill-rule="evenodd" d="M61.8 17.9A35 50 0 1 0 70 50H38V70H46.2A15 30 0 1 1 46.5 30.7Z"/></svg></span></span>
      <span class="tag">Game</span>
    </a>

    <a class="letter" style="--i: 4" href="experience.html" data-t="blue" data-face="red" aria-label="E, Experience">
      <span class="tilt"><span class="stack"><svg class="f" viewBox="0 0 70 100"><path fill-rule="evenodd" d="M0 0H70V20H20V40H60V60H20V80H70V100H0Z"/></svg></span></span>
      <span class="tag">Experience</span>
    </a>

    <a class="letter" style="--i: 5" href="reach.html" data-t="red" data-face="red" aria-label="R, Reach me">
      <span class="tilt"><span class="stack"><svg class="f" viewBox="0 0 70 100"><path fill-rule="evenodd" d="M0 0H40A30 30 0 0 1 40 60L70 100H50L20 60V100H0ZM20 20H40A10 10 0 0 1 40 40H20Z"/></svg></span></span>
      <span class="tag">Reach me</span>
    </a>
  </nav>

  <p class="hint">Tap a letter</p>

  <script>
    const KEY = 'fonger-letter';
    const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Filtr musí existovat dřív, než se stránka poprvé vykreslí
    if (window.fongerEnsureDefs) window.fongerEnsureDefs();

    const root = document.documentElement;
    const logo = document.getElementById('logo');

    // Drátěné vrstvy za písmenem: šest kopií tvaru, každá o kus hlouběji (CSS je posune do hloubky)
    document.querySelectorAll('.stack').forEach(stack => {
      const front = stack.querySelector('svg.f');
      for (let k = 6; k >= 1; k--) {
        const layer = front.cloneNode(true);
        layer.setAttribute('class', 'w');
        layer.setAttribute('aria-hidden', 'true');
        layer.style.setProperty('--k', k);
        stack.insertBefore(layer, front);
      }
    });

    const items = Array.from(document.querySelectorAll('.letter')).map((a, i) => ({
      a: a,
      i: i,
      face: a.querySelector('svg.f'),          // čelní plocha: ta se při přechodu přesune do rohu
      path: a.querySelector('svg.f path'),
      href: a.getAttribute('href'),
      t: a.dataset.t                           // red / pink / blue = barva cílové stránky
    }));

    /* ---------- Naklánění: každé písmeno se samo natáčí za kurzorem (jako velké E na Experience) ---------- */
    const REST = { rx: 4, ry: -14 };           // klidová poloha: lehce natočené, ať je vidět hloubka
    const tiltState = items.map(() => ({ rx: REST.rx, ry: REST.ry, tx: REST.rx, ty: REST.ry }));
    let frozen = false;                          // po kliknutí se naklánění zastaví

    items.forEach((item, i) => {
      const S = tiltState[i];

      const aim = e => {
        const b = item.a.getBoundingClientRect();
        const x = (e.clientX - b.left) / b.width - 0.5;       // -0.5 až 0.5
        const y = (e.clientY - b.top) / b.height - 0.5;
        S.ty = x * 56;                                         // doleva/doprava
        S.tx = -y * 36;                                        // nahoru/dolů
      };
      const rest = () => { S.tx = REST.rx; S.ty = REST.ry; };

      if (!calm) {
        item.a.addEventListener('pointerenter', aim);
        item.a.addEventListener('pointermove', aim);
        item.a.addEventListener('pointerleave', rest);
        item.a.addEventListener('pointercancel', rest);
      }
    });

    if (calm) {
      items.forEach(item => { item.a.style.setProperty('--rx', REST.rx + 'deg'); item.a.style.setProperty('--ry', REST.ry + 'deg'); });
    } else {
      (function loop() {
        if (!frozen) {
          items.forEach((item, i) => {
            const S = tiltState[i];
            S.rx += (S.tx - S.rx) * 0.12;
            S.ry += (S.ty - S.ry) * 0.12;
            item.a.style.setProperty('--rx', S.rx.toFixed(2) + 'deg');
            item.a.style.setProperty('--ry', S.ry.toFixed(2) + 'deg');
          });
        }
        requestAnimationFrame(loop);
      })();
    }

    /* ---------- Klik: zapamatujeme písmeno a necháme prohlížeč udělat přechod ---------- */
    items.forEach(item => {
      item.a.addEventListener('click', e => {
        // Stránka ještě neexistuje: nic se nestane
        if (!item.href || item.href === '#') { e.preventDefault(); return; }

        frozen = true;
        // písmeno se před přechodem srovná do základního tvaru (jinak by se přesunulo nakřivo)
        item.a.style.setProperty('--rx', '0deg');
        item.a.style.setProperty('--ry', '0deg');
        try {
          sessionStorage.setItem(KEY, JSON.stringify({
            i: item.i,
            d: item.path.getAttribute('d'),
            href: item.href
          }));
        } catch (err) {}
        window.__fongerChosen = item.face;
      });
    });

    window.addEventListener('pageshow', e => { if (e.persisted) frozen = false; });

    /* ---------- Světelné orby ---------- */

    /* Tři vrstvy hloubky:
       n = počet, size = velikost (px), op = jas, blur = rozmazání (px),
       drift = jak daleko se vznášejí (px, celkový rozsah pohybu),
       t = doba jednoho pohybu do strany (s), tw = doba pulzování (s) */
    const ORB_LAYERS = [
      { n: 22, size: [5, 12],   op: [0.35, 0.6],  blur: 0,  drift: [70, 150],  t: [12, 22], tw: [4, 8] },
      { n: 14, size: [12, 26],  op: [0.35, 0.55], blur: 1,  drift: [90, 190],  t: [16, 28], tw: [5, 10] },
      { n: 6,  size: [50, 120], op: [0.1, 0.2],   blur: 8,  drift: [130, 280], t: [24, 40], tw: [8, 14] }
    ];

    // Náhoda se vždy stejným výsledkem, ať obloha vypadá pokaždé stejně
    function makeRandom(seed) {
      return function () {
        seed |= 0;
        seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    (function buildOrbs() {
      const rnd = makeRandom(11);
      const between = (r) => r[0] + rnd() * (r[1] - r[0]);
      const host = document.getElementById('orbs');
      let html = '';

      ORB_LAYERS.forEach(L => {
        for (let i = 0; i < L.n; i++) {
          const warm = rnd() < 0.25;                            // pár teplejších orbů
          const c1 = warm ? 'rgba(255, 190, 180, 0.95)' : 'rgba(232, 232, 236, 0.95)';
          const c2 = warm ? 'rgba(255, 70, 60, 0.38)' : 'rgba(200, 200, 208, 0.40)';
          const dx = between(L.drift);
          const dy = between(L.drift) * 0.8;
          const t = between(L.t);
          const t2 = t * (0.65 + rnd() * 0.3);                  // jiná délka pohybu nahoru a dolů
          const k = between(L.tw);
          html +=
            '<span class="orb" style="' +
            '--x:' + (rnd() * 100).toFixed(1) + 'vw;' +
            '--y:' + (rnd() * 100).toFixed(1) + 'vh;' +
            '--s:' + between(L.size).toFixed(1) + 'px;' +
            '--o:' + between(L.op).toFixed(2) + ';' +
            '--b:' + L.blur + 'px;' +
            '--dx:' + dx.toFixed(0) + 'px;' +
            '--dy:' + dy.toFixed(0) + 'px;' +
            '--t:' + t.toFixed(1) + 's;' +
            '--t2:' + t2.toFixed(1) + 's;' +
            '--k:' + k.toFixed(1) + 's;' +
            '--d:-' + (rnd() * t).toFixed(1) + 's;' +
            '--d3:-' + (rnd() * t2).toFixed(1) + 's;' +
            '--d2:-' + (rnd() * k).toFixed(1) + 's;' +
            '--c1:' + c1 + ';--c2:' + c2 + ';"></span>';
        }
      });

      host.innerHTML = html;
    })();

    /* ---------- Texty v rozích ---------- */
    const BIRTH_YEAR = 2000;    // rok narození
    const BIRTH_MONTH = 6;      // měsíc narození (červen)
    const BIRTH_DAY = 12;       // den narození

    const greet = document.getElementById('greet');
    const clock = document.getElementById('clock');
    const level = document.getElementById('level');

    // Pozdrav podle denní doby návštěvníka
    function greeting(hour) {
      if (hour >= 5 && hour < 12) return 'Good morning';
      if (hour >= 12 && hour < 18) return 'Good afternoon';
      if (hour >= 18) return 'Good evening';
      return 'Up late?';
    }

    // Level = kolik je ti let. Zvedne se každý rok 12. června.
    function currentLevel(now) {
      let age = now.getFullYear() - BIRTH_YEAR;
      const m = now.getMonth() + 1;
      if (m < BIRTH_MONTH || (m === BIRTH_MONTH && now.getDate() < BIRTH_DAY)) age--;
      return age;
    }

    function tick() {
      const now = new Date();
      clock.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      greet.textContent = greeting(now.getHours());
      level.textContent = currentLevel(now);
    }
    tick();
    setInterval(tick, 10000);

  </script>
</body>
</html>
