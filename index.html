<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fonger</title>
  <link rel="stylesheet" href="style.css">
  <link rel="expect" href="#logo" blocking="render">
  <link rel="prefetch" href="soon.html">
  <link rel="prefetch" href="outings.html">
  <link rel="prefetch" href="reach.html">
  <link rel="prefetch" href="experience.html">
  <link rel="prefetch" href="game.html">
  <script src="transition.js"></script>
  <script src="stats.js"></script>
  <style>
    /* Výška písmen */
    :root { --h: clamp(4rem, 17vw, 13rem); }

    body { overflow: hidden; min-height: 100vh; min-height: 100svh; }

    /* ---------- Světelné orby ---------- */
    .orbs {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      animation: fadeIn 3s ease 1.2s both;
    }

    /* Jeden orb: měkká zářící kulička. Vlastnosti mu nastaví skript dole. */
    .orb {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--s);
      height: var(--s);
      margin: calc(var(--s) * -0.5) 0 0 calc(var(--s) * -0.5);
      border-radius: 50%;
      background: radial-gradient(circle, var(--c1) 0%, var(--c2) 30%, transparent 70%);
      opacity: var(--o);
      filter: blur(var(--b));
      will-change: transform, translate, opacity;
      /* Tři nezávislé pohyby: do stran, nahoru a dolů, a pulzování jasu */
      animation:
        floatX var(--t) ease-in-out infinite alternate,
        floatY var(--t2) ease-in-out infinite alternate,
        twinkle var(--k) ease-in-out infinite;
      animation-delay: var(--d), var(--d3), var(--d2);
    }

    /* Pohyb do stran a pohyb nahoru a dolů mají různé délky,
       takže orb pluje po plynulých obloucích, ne po přímce */
    @keyframes floatX {
      from { translate: calc(var(--dx) * -0.5) 0; }
      to   { translate: calc(var(--dx) * 0.5) 0; }
    }

    @keyframes floatY {
      from { transform: translateY(calc(var(--dy) * -0.5)); }
      to   { transform: translateY(calc(var(--dy) * 0.5)); }
    }

    /* Jemné pulzování jasu */
    @keyframes twinkle {
      0%, 100% { opacity: var(--o); }
      50%      { opacity: calc(var(--o) * 0.4); }
    }

    /* ---------- Nápis ---------- */

    /* Všech šest písmen vedle sebe */
    .logo {
      position: relative;
      z-index: 2;
      display: flex;
      gap: calc(var(--h) * 0.12);
    }

    /* Jedno písmeno = jeden odkaz. Při načtení se nafoukne od země. */
    .letter {
      position: relative;
      display: block;
      text-decoration: none;
      outline: none;
      transform-origin: 50% 100%;
      animation: inflate 1.15s ease-out both;
      animation-delay: calc(var(--i) * 150ms);
    }

    @keyframes inflate {
      0%   { opacity: 0; transform: translateY(1.2rem) scale(0.2, 0.05); }
      35%  { opacity: 1; transform: translateY(0) scale(0.8, 1.25); }
      55%  { transform: scale(1.18, 0.88); }
      72%  { transform: scale(0.94, 1.08); }
      86%  { transform: scale(1.04, 0.97); }
      100% { opacity: 1; transform: scale(1, 1); }
    }

    /* Při návratu z podstránky se úvodní animace nepřehrávají znovu */
    html.vt .letter,
    html.vt .frame,
    html.vt .meta,
    html.vt .orbs { animation: none; }

    /* 3D písmeno ve stylu velkého E na stránce Experience:
       červená čelní plocha a za ní šedé drátěné vrstvy do hloubky.
       .tilt se naklání, když přes písmeno přejedeš (každé písmeno samo). */
    /* Myš reaguje na pevný čtverec písmene (a), ne na natočený tvar: jinak se písmeno "třese" pod kurzorem */
    .tilt, .tilt * { pointer-events: none; }

    .tilt {
      display: block;
      transform-style: preserve-3d;
      transform: perspective(900px) rotateX(var(--rx, 4deg)) rotateY(var(--ry, -14deg));
    }

    .stack {
      position: relative;
      display: block;
      width: calc(var(--h) * 0.7);
      height: var(--h);
      transform-style: preserve-3d;
      transform-origin: 50% 100%;
    }

    .stack svg {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Drátěné vrstvy za písmenem, každá o kus hlouběji a průhlednější */
    .stack svg.w { transform: translateZ(calc(var(--k) * var(--h) * -0.06)); }
    .stack svg.w path {
      fill: rgba(255, 255, 255, 0.012);
      stroke: rgba(205, 205, 214, calc(0.7 - var(--k) * 0.09));
      stroke-width: 1.2px;
      vector-effect: non-scaling-stroke;
    }

    /* Čelní plocha: barevný přechod. Barvu (red / pink / blue) mění atribut data-face. */
    .stack svg.f {
      filter: drop-shadow(0 0 1.1rem rgba(255, 50, 50, 0.38));
      transition: filter 0.3s ease;
    }
    .stack svg.f path {
      fill: url(#fx-red) #b3081a;
      stroke: #ffb4aa;
      stroke-width: 1.4px;
      vector-effect: non-scaling-stroke;
    }
    .letter[data-face="pink"] svg.f path { fill: url(#fx-pink) #ff4fa6; stroke: #ffd6ec; }
    .letter[data-face="blue"] svg.f path { fill: url(#fx-blue) #0b3fb5; stroke: #b9d4ff; }
    .letter[data-face="pink"] svg.f { filter: drop-shadow(0 0 1.1rem rgba(255, 90, 170, 0.5)); }
    .letter[data-face="blue"] svg.f { filter: drop-shadow(0 0 1.1rem rgba(60, 130, 255, 0.5)); }

    /* Barva záře při najetí prozradí, kam písmeno vede */
    .letter { --hov: 255, 60, 60; }
    .letter[data-t="pink"] { --hov: 255, 90, 170; }
    .letter[data-t="blue"] { --hov: 70, 140, 255; }
    .letter[data-t="green"] { --hov: 60, 255, 130; }
    .letter[data-t="gold"] { --hov: 255, 200, 90; }

    .letter:hover svg.f,
    .letter:focus-visible svg.f {
      filter: brightness(1.18) drop-shadow(0 0 1.6rem rgba(var(--hov), 0.7));
    }

    /* Popisek pod písmenem */
    .tag {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 1.5rem;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      white-space: nowrap;
      color: var(--ink);
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.8);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .letter:hover .tag,
    .letter:focus-visible .tag { opacity: 1; color: rgb(var(--hov)); text-shadow: 0 0 14px rgba(var(--hov), 0.55), 0 1px 10px rgba(0, 0, 0, 0.8); }
    .letter[data-t="red"]:hover .tag { color: var(--ink); text-shadow: 0 1px 10px rgba(0, 0, 0, 0.8); }

    /* ---------- Plakátové detaily ---------- */

    /* Tenký rámeček kolem celé stránky */
    .frame {
      position: fixed;
      inset: 16px;
      z-index: 1;
      border: 1px solid rgba(255, 90, 90, 0.16);
      pointer-events: none;
      animation: fadeIn 1.6s ease 1.7s both;
    }

    /* Drobné texty v rozích */
    .meta {
      position: fixed;
      z-index: 2;
      font-size: 0.74rem;
      line-height: 1.55;
      letter-spacing: 0.08em;
      color: rgba(225, 222, 220, 0.5);
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      animation: fadeIn 1.6s ease 1.9s both;
    }

    .meta b {
      display: block;
      font-weight: 600;
      color: rgba(228, 232, 244, 0.88);
    }

    .meta.tl { top: 32px; left: 36px; text-align: left; }
    .meta.tr { top: 32px; right: 36px; text-align: right; }
    .meta.br { bottom: 32px; right: 36px; text-align: right; }

    /* Tečky za "loading the rest" se postupně objevují */
    .dots::after {
      content: "";
      animation: dots 1.8s steps(1) infinite;
    }

    @keyframes dots {
      0%   { content: ""; }
      25%  { content: "."; }
      50%  { content: ".."; }
      75%  { content: "..."; }
    }

    /* Nápověda pod nápisem, ukáže se jen na dotykových zařízeních */
    .hint {
      display: none;
      position: fixed;
      z-index: 2;
      left: 36px;
      bottom: 32px;
      margin: 0;
      font-size: 0.78rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(228, 232, 244, 0.7);
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      animation: fadeIn 1.2s ease 2.6s both, hintPulse 2.8s ease-in-out 3.8s infinite;
    }

    @keyframes hintPulse {
      0%, 100% { opacity: 0.3; }
      50%      { opacity: 0.9; }
    }

    /* Dotyková zařízení: žádné popisky pod písmeny. Popisek se ukáže nad písmenem,
       dokud ho držíš prstem, a písmena G, E, R (která někam vedou) jemně svítí. */
    @media (hover: none) {
      .hint { display: block; }

      .tag {
        top: auto;
        bottom: 100%;
        margin: 0 0 0.9rem;
        font-size: 0.95rem;
        letter-spacing: 0.14em;
        opacity: 0;
        transition: opacity 0.12s ease;
      }

      .letter:active .tag { opacity: 1; }

      .letter:nth-child(n+4)::before {
        content: "";
        position: absolute;
        inset: -22% -34%;
        z-index: -1;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 70, 70, 0.55), rgba(255, 70, 70, 0));
        pointer-events: none;
        opacity: 0;
        animation: breathe 3.2s ease-in-out infinite;
        animation-delay: calc(var(--i) * 350ms + 1.6s);
      }
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.15; transform: scale(0.9); }
      50%      { opacity: 1;    transform: scale(1.08); }
    }

    @media (max-width: 700px) {
      .meta { font-size: 0.66rem; }
      .meta.tl { left: 28px; top: 28px; }
      .meta.tr { right: 28px; top: 28px; }
      .meta.br { right: 28px; bottom: 28px; }
    }

    /* Kdo má vypnuté animace: orby stojí na místě, tečky jsou prostě vidět */
    @media (prefers-reduced-motion: reduce) {
      .dots::after { animation: none; content: "..."; }
      .orb { animation: none !important; }
      .hint { animation: none !important; opacity: 0.6; }
      .letter:nth-child(n+4)::before { animation: none !important; opacity: 0.6; }
    }
        /* Telefon na výšku: písmena jsou velká a jdou schodištěm zleva nahoře doprava dolů */
    @media (max-width: 700px) and (orientation: portrait) {
      :root {
        --h: min(24vw, 10.6svh);
        --dx: calc((82vw - var(--h) * 0.7) / 5);     /* o kolik je každé další písmeno víc vpravo */
      }

      .logo {
        flex-direction: column;
        align-items: flex-start;
        width: 82vw;
        gap: calc(var(--h) * 0.1);
      }

      .letter { margin-left: calc(var(--i) * var(--dx)); }
      .logo { transform: translateY(10px); }
      .letter:nth-child(2) { margin-top: calc(var(--h) * -0.1); }   /* F je vpravo dole otevřené, mezera mezi F a O by vypadala větší */

      .hint { left: 28px; bottom: 28px; }

      /* Text "Level" přesouváme vlevo dolů, vpravo dole je písmeno R */
      .meta.br { right: auto; left: 28px; bottom: 62px; text-align: left; }
    }

    /* Telefon na výšku: popisek se ukáže vedle písmene, ne nad ním (nahoře by překrýval jiné písmeno).
       F, O, N mají popisek vpravo, G, E, R vlevo, protože tam je místo. */
    @media (hover: none) and (max-width: 700px) and (orientation: portrait) {
      .tag {
        top: 50%;
        bottom: auto;
        left: auto;
        right: 100%;
        margin: 0;
        padding-right: 1rem;
        transform: translateY(-50%);
      }
      .letter:nth-child(-n+3) .tag {
        right: auto;
        left: 100%;
        padding: 0 0 0 1rem;
      }
    }

    /* ---------- Krvavě rudý vzhled ---------- */
    body {
      background-color: #030001 !important;
      background-image: radial-gradient(circle at 50% 42%, #0e0309, #030001 72%) !important;
    }
    .letter svg.f path { stroke: #ffc2b8; stroke-width: 2.2px; }
    .letter[data-face="red"] svg.f { filter: drop-shadow(0 0 1.4rem rgba(255, 30, 44, 0.8)); }
    .letter[data-face="red"]:hover svg.f,
    .letter[data-face="red"]:focus-visible svg.f { filter: brightness(1.18) drop-shadow(0 0 1.8rem rgba(var(--hov), 0.9)) drop-shadow(0 0 4rem rgba(var(--hov), 0.45)); }
    .frame { border-color: rgba(255, 40, 50, 0.12); }
    #bolts { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
    #bgfx, #embers { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    /* Nápisy v rozích: bílé, v tmavém rámečku se seříznutým rohem a červenou září */
    .meta {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 0.7rem;
      color: #aaa0a0;
      padding: 9px 14px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(10, 0, 3, 0.6);
      box-shadow: 0 0 16px rgba(255, 20, 40, 0.3), inset 0 0 10px rgba(255, 255, 255, 0.04);
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    }
    .meta b { color: #fff; }
    .meta span { color: #aaa0a0; }
    @media (max-width: 700px) and (orientation: portrait) { .meta { font-size: 0.6rem; letter-spacing: 0.14em; padding: 7px 10px; } }

    /* ---------- Popisky: obrys se září, zalévaná výplň, červená čára odkryje slovo ---------- */
    .letter:hover svg.f,
    .letter:focus-visible svg.f { filter: brightness(1.18) drop-shadow(0 0 1.8rem rgba(var(--hov), 0.85)); }
    .tag {
      font-size: 1.7rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.16em;
      color: transparent !important;
      -webkit-text-stroke: 1.3px rgb(var(--hov));
      text-shadow: 0 0 18px rgba(var(--hov), 0.8), 0 0 40px rgba(var(--hov), 0.4);
      transition: none;
    }
    .letter[data-t="red"] .tag { -webkit-text-stroke: 1.3px #ffc2b8; }
    .tag::before {
      content: attr(data-x); position: absolute; left: 0; top: 0;
      -webkit-text-stroke: 0; text-shadow: 0 0 14px rgba(var(--hov), 0.9);
      color: rgba(var(--hov), 0.9);
      clip-path: inset(58% 0 0 0);
    }
    .letter[data-t="red"] .tag::before { color: rgba(255, 70, 80, 0.9); text-shadow: 0 0 14px rgba(255, 30, 50, 0.9); }
    .tag::after {
      content: ""; position: absolute; top: -4px; bottom: -4px; left: 0; width: 3px;
      background: #ff2a38; box-shadow: 0 0 14px 3px rgba(255, 30, 50, 0.9); opacity: 0;
    }
    @media (hover: hover) {
      .tag { clip-path: inset(-30px 100% -30px 0); }
      .letter:hover .tag, .letter:focus-visible .tag { opacity: 1; animation: tagWipe 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      .letter:hover .tag::before, .letter:focus-visible .tag::before { animation: tagFill 0.7s 0.25s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      .letter:hover .tag::after, .letter:focus-visible .tag::after { animation: tagLine 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    }
    @keyframes tagWipe { from { clip-path: inset(-30px 100% -30px 0); } to { clip-path: inset(-30px -20px -30px -20px); } }
    @keyframes tagFill { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(58% 0 0 0); } }
    @keyframes tagLine { 0% { left: 0; opacity: 1; } 85% { opacity: 1; } 100% { left: 100%; opacity: 0; } }
    @media (hover: none) { .tag { font-size: 1.15rem; letter-spacing: 0.12em; } }
    @media (prefers-reduced-motion: reduce) { .tag, .tag::before, .tag::after { animation: none !important; clip-path: none; } .tag::before { clip-path: inset(58% 0 0 0); } .tag::after { display: none; } }
  </style>
</head>
<body>
  <!-- Světelné orby: vytvoří je skript dole -->
  <div class="orbs" id="orbs" aria-hidden="true"></div>

  <!-- Rámeček a drobné texty v rozích. Texty se vyplňují skriptem dole. -->
  <div class="frame" aria-hidden="true"></div>

  <div class="meta tl"><b id="greet">Hello</b></div>
  <div class="meta tr"><b>Local time</b><span id="clock">--:--</span></div>
  <div class="meta br"><b>Level <span id="level">26</span></b>loading the rest<span class="dots"></span></div>

  <!-- Tvar každého písmene je v atributu d. Můžeš si ho zkusit upravit. -->
  <nav class="logo" id="logo" aria-label="Hlavní menu">
    <a class="letter" style="--i: 0" href="soon.html" data-t="red" data-face="red" aria-label="F, Soon">
      <span class="tilt"><span class="stack"><svg class="f" viewBox="0 0 70 100"><path fill-rule="evenodd" d="M0 0H70V20H20V40H58V60H20V100H0Z"/></svg></span></span>
      <span class="tag" data-x="Soon">Soon</span>
    </a>

    <a class="letter" style="--i: 1" href="outings.html" data-t="gold" data-face="red" aria-label="O, Outings">
      <span class="tilt"><span class="stack"><svg class="f" viewBox="0 0 70 100"><path fill-rule="evenodd" d="M0 50A35 50 0 1 1 70 50A35 50 0 1 1 0 50ZM20 50A15 30 0 1 0 50 50A15 30 0 1 0 20 50Z"/></svg></span></span>
      <span class="tag" data-x="Outings">Outings</span>
    </a>

    <a class="letter" style="--i: 2" href="soon.html" data-t="red" data-face="red" aria-label="N, Soon">
      <span class="tilt"><span class="stack"><svg class="f" viewBox="0 0 70 100"><path fill-rule="evenodd" d="M0 0H20L50 60V0H70V100H50L20 40V100H0Z"/></svg></span></span>
      <span class="tag" data-x="Soon">Soon</span>
    </a>

    <a class="letter" style="--i: 3" href="game.html" data-t="pink" data-face="red" aria-label="G, Game">
      <span class="tilt"><span class="stack"><svg class="f" viewBox="0 0 70 100"><path fill-rule="evenodd" d="M61.8 17.9A35 50 0 1 0 70 50H38V70H46.2A15 30 0 1 1 46.5 30.7Z"/></svg></span></span>
      <span class="tag" data-x="Game">Game</span>
    </a>

    <a class="letter" style="--i: 4" href="experience.html" data-t="blue" data-face="red" aria-label="E, Experience">
      <span class="tilt"><span class="stack"><svg class="f" viewBox="0 0 70 100"><path fill-rule="evenodd" d="M0 0H70V20H20V40H60V60H20V80H70V100H0Z"/></svg></span></span>
      <span class="tag" data-x="Experience">Experience</span>
    </a>

    <a class="letter" style="--i: 5" href="reach.html" data-t="green" data-face="red" aria-label="R, Reach me">
      <span class="tilt"><span class="stack"><svg class="f" viewBox="0 0 70 100"><path fill-rule="evenodd" d="M0 0H40A30 30 0 0 1 40 60L70 100H50L20 60V100H0ZM20 20H40A10 10 0 0 1 40 40H20Z"/></svg></span></span>
      <span class="tag" data-x="Reach me">Reach me</span>
    </a>
  </nav>

  <p class="hint">Tap a letter</p>

  <script>
    const KEY = 'fonger-letter';
    const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Filtr musí existovat dřív, než se stránka poprvé vykreslí
    if (window.fongerEnsureDefs) window.fongerEnsureDefs();

    const root = document.documentElement;
    const logo = document.getElementById('logo');

    // Drátěné vrstvy za písmenem: šest kopií tvaru, každá o kus hlouběji (CSS je posune do hloubky)
    document.querySelectorAll('.stack').forEach(stack => {
      const front = stack.querySelector('svg.f');
      for (let k = 6; k >= 1; k--) {
        const layer = front.cloneNode(true);
        layer.setAttribute('class', 'w');
        layer.setAttribute('aria-hidden', 'true');
        layer.style.setProperty('--k', k);
        stack.insertBefore(layer, front);
      }
    });

    const items = Array.from(document.querySelectorAll('.letter')).map((a, i) => ({
      a: a,
      i: i,
      face: a.querySelector('svg.f'),          // čelní plocha: ta se při přechodu přesune do rohu
      path: a.querySelector('svg.f path'),
      href: a.getAttribute('href'),
      t: a.dataset.t                           // red / pink / blue = barva cílové stránky
    }));

    /* ---------- Naklánění: každé písmeno se samo natáčí za kurzorem (jako velké E na Experience) ---------- */
    const REST = { rx: 4, ry: -14 };           // klidová poloha: lehce natočené, ať je vidět hloubka
    const tiltState = items.map(() => ({ rx: REST.rx, ry: REST.ry, tx: REST.rx, ty: REST.ry }));
    let frozen = false;                          // po kliknutí se naklánění zastaví

    items.forEach((item, i) => {
      const S = tiltState[i];

      const aim = e => {
        const b = item.a.getBoundingClientRect();
        const x = (e.clientX - b.left) / b.width - 0.5;       // -0.5 až 0.5
        const y = (e.clientY - b.top) / b.height - 0.5;
        S.ty = x * 56;                                         // doleva/doprava
        S.tx = -y * 36;                                        // nahoru/dolů
      };
      const rest = () => { S.tx = REST.rx; S.ty = REST.ry; };

      if (!calm) {
        item.a.addEventListener('pointerenter', aim);
        item.a.addEventListener('pointermove', aim);
        item.a.addEventListener('pointerleave', rest);
        item.a.addEventListener('pointercancel', rest);
      }
    });

    if (calm) {
      items.forEach(item => { item.a.style.setProperty('--rx', REST.rx + 'deg'); item.a.style.setProperty('--ry', REST.ry + 'deg'); });
    } else {
      (function loop() {
        if (!frozen) {
          items.forEach((item, i) => {
            const S = tiltState[i];
            S.rx += (S.tx - S.rx) * 0.12;
            S.ry += (S.ty - S.ry) * 0.12;
            item.a.style.setProperty('--rx', S.rx.toFixed(2) + 'deg');
            item.a.style.setProperty('--ry', S.ry.toFixed(2) + 'deg');
          });
        }
        requestAnimationFrame(loop);
      })();
    }

    /* ---------- Klik: zapamatujeme písmeno a necháme prohlížeč udělat přechod ---------- */
    items.forEach(item => {
      item.a.addEventListener('click', e => {
        // Stránka ještě neexistuje: nic se nestane
        if (!item.href || item.href === '#') { e.preventDefault(); return; }

        frozen = true;
        // písmeno se před přechodem srovná do základního tvaru (jinak by se přesunulo nakřivo)
        item.a.style.setProperty('--rx', '0deg');
        item.a.style.setProperty('--ry', '0deg');
        try {
          sessionStorage.setItem(KEY, JSON.stringify({
            i: item.i,
            d: item.path.getAttribute('d'),
            href: item.href
          }));
        } catch (err) {}
        window.__fongerChosen = item.face;
      });
    });

    window.addEventListener('pageshow', e => { if (e.persisted) frozen = false; });

    /* ---------- Světelné orby ---------- */

    /* Tři vrstvy hloubky:
       n = počet, size = velikost (px), op = jas, blur = rozmazání (px),
       drift = jak daleko se vznášejí (px, celkový rozsah pohybu),
       t = doba jednoho pohybu do strany (s), tw = doba pulzování (s) */
    const ORB_LAYERS = [
      { n: 22, size: [5, 12],   op: [0.35, 0.6],  blur: 0,  drift: [70, 150],  t: [12, 22], tw: [4, 8] },
      { n: 14, size: [12, 26],  op: [0.35, 0.55], blur: 1,  drift: [90, 190],  t: [16, 28], tw: [5, 10] },
      { n: 6,  size: [50, 120], op: [0.1, 0.2],   blur: 8,  drift: [130, 280], t: [24, 40], tw: [8, 14] }
    ];

    // Náhoda se vždy stejným výsledkem, ať obloha vypadá pokaždé stejně
    function makeRandom(seed) {
      return function () {
        seed |= 0;
        seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    (function buildOrbs() {
      const rnd = makeRandom(11);
      const between = (r) => r[0] + rnd() * (r[1] - r[0]);
      const host = document.getElementById('orbs');
      let html = '';

      ORB_LAYERS.forEach(L => {
        for (let i = 0; i < L.n; i++) {
          const warm = rnd() < 0.25;                            // pár teplejších orbů
          const c1 = warm ? 'rgba(255, 190, 180, 0.95)' : 'rgba(232, 232, 236, 0.95)';
          const c2 = warm ? 'rgba(255, 70, 60, 0.38)' : 'rgba(200, 200, 208, 0.40)';
          const dx = between(L.drift);
          const dy = between(L.drift) * 0.8;
          const t = between(L.t);
          const t2 = t * (0.65 + rnd() * 0.3);                  // jiná délka pohybu nahoru a dolů
          const k = between(L.tw);
          html +=
            '<span class="orb" style="' +
            '--x:' + (rnd() * 100).toFixed(1) + 'vw;' +
            '--y:' + (rnd() * 100).toFixed(1) + 'vh;' +
            '--s:' + between(L.size).toFixed(1) + 'px;' +
            '--o:' + between(L.op).toFixed(2) + ';' +
            '--b:' + L.blur + 'px;' +
            '--dx:' + dx.toFixed(0) + 'px;' +
            '--dy:' + dy.toFixed(0) + 'px;' +
            '--t:' + t.toFixed(1) + 's;' +
            '--t2:' + t2.toFixed(1) + 's;' +
            '--k:' + k.toFixed(1) + 's;' +
            '--d:-' + (rnd() * t).toFixed(1) + 's;' +
            '--d3:-' + (rnd() * t2).toFixed(1) + 's;' +
            '--d2:-' + (rnd() * k).toFixed(1) + 's;' +
            '--c1:' + c1 + ';--c2:' + c2 + ';"></span>';
        }
      });

      host.innerHTML = html;
    })();

    /* ---------- Texty v rozích ---------- */
    const BIRTH_YEAR = 2000;    // rok narození
    const BIRTH_MONTH = 6;      // měsíc narození (červen)
    const BIRTH_DAY = 12;       // den narození

    const greet = document.getElementById('greet');
    const clock = document.getElementById('clock');
    const level = document.getElementById('level');

    // Pozdrav podle denní doby návštěvníka
    function greeting(hour) {
      if (hour >= 5 && hour < 12) return 'Good morning';
      if (hour >= 12 && hour < 18) return 'Good afternoon';
      if (hour >= 18) return 'Good evening';
      return 'Up late?';
    }

    // Level = kolik je ti let. Zvedne se každý rok 12. června.
    function currentLevel(now) {
      let age = now.getFullYear() - BIRTH_YEAR;
      const m = now.getMonth() + 1;
      if (m < BIRTH_MONTH || (m === BIRTH_MONTH && now.getDate() < BIRTH_DAY)) age--;
      return age;
    }

    function tick() {
      const now = new Date();
      clock.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      greet.textContent = greeting(now.getHours());
      level.textContent = currentLevel(now);
    }
    tick();
    setInterval(tick, 10000);
  </script>

  <!-- Elektrické záblesky: drobné jiskry na písmenech, jiskry po kliknutí do pozadí a občas velký rudý záblesk daleko od nápisu -->
  <canvas id="bolts" aria-hidden="true"></canvas>
  <script>
  (function () {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var cv = document.getElementById('bolts'), g = cv.getContext('2d'), W, H, dpr, fx = [], running = false;
    function size() { dpr = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); }
    size(); addEventListener('resize', size);
    var rnd = function (a, b) { return a + Math.random() * (b - a); };
    var letters = function () { return Array.prototype.map.call(document.querySelectorAll('.letter'), function (e) { return e.getBoundingClientRect(); }); };

    /* Klikatá čára z bodu x,y; občas se z ní odštěpí menší větev */
    function bolt(x, y, ang, len, branch) {
      var pts = [[x, y]], n = Math.max(5, Math.round(len / 9)), step = len / n;
      for (var i = 0; i < n; i++) {
        ang += rnd(-0.9, 0.9); x += Math.cos(ang) * step; y += Math.sin(ang) * step; pts.push([x, y]);
      }
      var out = { pts: pts, kids: [] };
      if (branch && len > 50) for (var k = 2; k < pts.length - 1; k++) if (Math.random() < 0.18) out.kids.push(bolt(pts[k][0], pts[k][1], ang + rnd(-1.2, 1.2), len * rnd(0.25, 0.45), false));
      return out;
    }
    function drawBolt(b, a, w) {
      g.beginPath(); g.moveTo(b.pts[0][0], b.pts[0][1]);
      for (var i = 1; i < b.pts.length; i++) g.lineTo(b.pts[i][0], b.pts[i][1]);
      g.strokeStyle = 'rgba(255,70,80,' + a + ')'; g.lineWidth = w; g.shadowColor = 'rgba(255,20,40,' + a + ')'; g.shadowBlur = 12; g.stroke();
      g.strokeStyle = 'rgba(255,215,215,' + a * 0.85 + ')'; g.lineWidth = w * 0.4; g.shadowBlur = 0; g.stroke();
      b.kids.forEach(function (k) { drawBolt(k, a * 0.8, w * 0.7); });
    }
    function add(e) { e.t0 = performance.now(); fx.push(e); if (!running) { running = true; requestAnimationFrame(frame); } }

    /* Drobná jiskra na okraji náhodného písmene */
    function spark() {
      var L = letters(), r = L[Math.floor(Math.random() * L.length)]; if (!r) return;
      var x = r.left + rnd(0, r.width), y = r.top + rnd(0, r.height);
      if (Math.random() < 0.7) { if (Math.random() < 0.5) x = r.left + (Math.random() < 0.5 ? 0 : r.width); else y = r.top + (Math.random() < 0.5 ? 0 : r.height); }
      add({ type: 'bolt', life: rnd(110, 190), w: rnd(1, 1.5), b: bolt(x, y, rnd(0, 6.28), rnd(30, 80), true) });
    }
    /* Jiskry po kliknutí do pozadí */
    function burst(x, y) {
      var n = 3 + Math.floor(Math.random() * 3);
      for (var i = 0; i < n; i++) add({ type: 'bolt', life: rnd(150, 260), w: rnd(1.1, 1.7), b: bolt(x, y, (i / n) * 6.28 + rnd(-0.4, 0.4), rnd(40, 110), true) });
      add({ type: 'glow', x: x, y: y, r: 70, life: 220, a: 0.35 });
    }
    /* Velký rudý záblesk daleko od nápisu: na okraji obrazovky, nikdy za písmeny */
    function flash() {
      var L = letters(), pad = 60;
      for (var tries = 0; tries < 30; tries++) {
        var x = rnd(0, W), y = rnd(0, H), r = rnd(180, 340), ok = true;
        for (var i = 0; i < L.length; i++) {
          var q = L[i];
          if (x > q.left - pad - r * 0.5 && x < q.right + pad + r * 0.5 && y > q.top - pad - r * 0.5 && y < q.bottom + pad + r * 0.5) { ok = false; break; }
        }
        if (ok) { add({ type: 'glow', x: x, y: y, r: r, life: rnd(520, 800), a: 0.42, flick: true }); return; }
      }
    }

    function frame(now) {
      g.clearRect(0, 0, W, H);
      fx = fx.filter(function (e) {
        var p = (now - e.t0) / e.life; if (p >= 1) return false;
        g.save();
        if (e.type === 'glow') {
          var a = e.a * (1 - p) * (e.flick ? (0.55 + 0.45 * Math.abs(Math.sin(p * 17))) : 1);
          var gr = g.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r);
          gr.addColorStop(0, 'rgba(255,30,50,' + a + ')'); gr.addColorStop(0.45, 'rgba(190,10,30,' + a * 0.4 + ')'); gr.addColorStop(1, 'rgba(120,0,15,0)');
          g.fillStyle = gr; g.fillRect(e.x - e.r, e.y - e.r, e.r * 2, e.r * 2);
        } else {
          var on = Math.floor(p * 6) % 2 === 0 || p < 0.25;      // bliká, ne plynule
          if (on) drawBolt(e.b, 1 - p * 0.5, e.w);
        }
        g.restore();
        return true;
      });
      if (fx.length) requestAnimationFrame(frame); else { running = false; g.clearRect(0, 0, W, H); }
    }

    (function loopFlash() { setTimeout(function () { if (!document.hidden) flash(); loopFlash(); }, rnd(4500, 9500)); })();
    addEventListener('pointerdown', function (e) { if (!e.target.closest('.letter')) burst(e.clientX, e.clientY); });
    window.__bolts = { spark: spark, flash: flash, burst: burst };
  })();
  </script>

  <!-- Pozadí: žilky, jiskry a skenovací linky. Nikdy nejdou přes nápis. -->
  <canvas id="bgfx" aria-hidden="true"></canvas>
  <canvas id="embers" aria-hidden="true"></canvas>
  <script>
  (function () {
    var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var bg = document.getElementById('bgfx'), em = document.getElementById('embers');
    var g = bg.getContext('2d'), e = em.getContext('2d'), W, H, dpr, veins = [], parts = [], clear;
    var seed = 7; function R() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    var Q = function (a, b) { return a + Math.random() * (b - a); };

    function titleBox() {
      var L = document.querySelectorAll('.letter'), x0 = 1e9, y0 = 1e9, x1 = 0, y1 = 0;
      Array.prototype.forEach.call(L, function (el) { var r = el.getBoundingClientRect(); x0 = Math.min(x0, r.left); y0 = Math.min(y0, r.top); x1 = Math.max(x1, r.right); y1 = Math.max(y1, r.bottom); });
      if (x0 > x1) { x0 = W * .1; x1 = W * .9; y0 = H * .35; y1 = H * .65; }
      return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
    }
    function vein(x, y, a, len, w) {
      if (len < 8 || w < 0.3) return;
      var pts = [[x, y]], k = Math.floor(len / 9), px = x, py = y;
      for (var i = 0; i < k; i++) {
        a += (R() - .5) * .6; px += Math.cos(a) * 9; py += Math.sin(a) * 9; pts.push([px, py]);
        if (R() < .1) { veins.push({ node: [px, py] }); vein(px, py, a + (R() < .5 ? -1 : 1) * (.5 + R() * .5), len * .55, w * .7); }
      }
      veins.push({ pts: pts, w: w });
    }
    function paint() {
      dpr = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
      [bg, em].forEach(function (c) { c.width = W * dpr; c.height = H * dpr; });
      g.setTransform(dpr, 0, 0, dpr, 0, 0); e.setTransform(dpr, 0, 0, dpr, 0, 0);
      seed = 7; veins = []; clear = titleBox();
      var sc = Math.max(.6, Math.min(1, W / 1280)), cnt = W < 700 ? 5 : 8;
      for (var i = 0; i < cnt; i++) { vein(R() * W, 0, 1.57 + (R() - .5) * .8, 300 * sc, 2); vein(R() * W, H, -1.57 + (R() - .5) * .8, 300 * sc, 2); }
      for (i = 0; i < 6; i++) { vein(0, R() * H, (R() - .5) * .8, 260 * sc, 1.8); vein(W, R() * H, 3.14 + (R() - .5) * .8, 260 * sc, 1.8); }
      g.clearRect(0, 0, W, H);
      veins.forEach(function (v) {
        if (v.node) { if (R() < .5) { var gr = g.createRadialGradient(v.node[0], v.node[1], 0, v.node[0], v.node[1], 9); gr.addColorStop(0, 'rgba(255,120,120,.9)'); gr.addColorStop(1, 'rgba(255,30,40,0)'); g.fillStyle = gr; g.beginPath(); g.arc(v.node[0], v.node[1], 9, 0, 6.28); g.fill(); } return; }
        g.beginPath(); v.pts.forEach(function (p, i) { i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); });
        g.strokeStyle = 'rgba(230,30,48,' + (.25 + v.w * .22) + ')'; g.lineWidth = v.w; g.shadowColor = 'rgba(255,20,40,.9)'; g.shadowBlur = 10; g.stroke(); g.shadowBlur = 0;
      });
      /* tmavý pás za nápisem, ať žilky nejdou přes písmena */
      var cx = clear.x + clear.w / 2, cy = clear.y + clear.h / 2, rx = clear.w * .62 + 40, ry = clear.h * .95 + 30;
      var gg = g.createRadialGradient(0, 0, 10, 0, 0, rx);
      gg.addColorStop(0, 'rgba(2,0,1,.96)'); gg.addColorStop(.6, 'rgba(2,0,1,.78)'); gg.addColorStop(1, 'rgba(2,0,1,0)');
      g.save(); g.translate(cx, cy); g.scale(1, ry / rx); g.fillStyle = gg; g.fillRect(-rx, -rx, rx * 2, rx * 2); g.restore();
      var vg = g.createRadialGradient(W / 2, H / 2, H * .4, W / 2, H / 2, H * 1.05); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.6)');
      g.fillStyle = vg; g.fillRect(0, 0, W, H);
      g.fillStyle = 'rgba(0,0,0,.14)'; for (var y = 0; y < H; y += 4) g.fillRect(0, y, W, 1);
      e.clearRect(0, 0, W, H);
      if (still) return;
    }
    function inClear(x, y) { return x > clear.x - 20 && x < clear.x + clear.w + 20 && y > clear.y - 30 && y < clear.y + clear.h + 30; }
    function spawn(init) {
      var x, y, t = 0; do { x = Q(0, W); y = init ? Q(0, H) : H + 10; t++; } while (inClear(x, y) && t < 8);
      parts.push({ x: x, y: y, r: Q(.6, 1.8), vy: Q(.12, .4), ph: Q(0, 6.28), a: Q(.3, .8), g: Q(0, 90) | 0 });
    }
    var pulse = null;
    function run() {
      e.clearRect(0, 0, W, H);
      parts.forEach(function (p) {
        p.y -= p.vy; p.x += Math.sin(p.ph += .02) * .3;
        var f = .55 + .45 * Math.sin(p.ph * 2.3);
        e.fillStyle = 'rgba(255,' + (90 + p.g) + ',70,' + (p.a * f) + ')'; e.shadowColor = 'rgba(255,40,40,1)'; e.shadowBlur = 8;
        e.beginPath(); e.arc(p.x, p.y, p.r, 0, 6.28); e.fill();
      });
      e.shadowBlur = 0;
      parts = parts.filter(function (p) { return p.y > -10; }); while (parts.length < 70) spawn(false);
      /* světelný puls putující po žilce */
      if (!pulse && Math.random() < .01) { var c = veins.filter(function (v) { return v.pts && v.pts.length > 14; }); if (c.length) pulse = { v: c[Math.floor(Math.random() * c.length)], i: 0 }; }
      if (pulse) {
        var P = pulse.v.pts, hi = Math.min(P.length - 1, Math.floor(pulse.i)), lo = Math.max(0, hi - 6); e.beginPath(); for (var k = lo; k <= hi; k++) k === lo ? e.moveTo(P[k][0], P[k][1]) : e.lineTo(P[k][0], P[k][1]);
        e.strokeStyle = 'rgba(255,170,170,.9)'; e.lineWidth = 2; e.shadowColor = 'rgba(255,40,50,1)'; e.shadowBlur = 14; e.stroke(); e.shadowBlur = 0;
        pulse.i += .7; if (pulse.i > P.length + 6) pulse = null;
      }
      if (!document.hidden) requestAnimationFrame(run); else document.addEventListener('visibilitychange', function f() { if (!document.hidden) { document.removeEventListener('visibilitychange', f); requestAnimationFrame(run); } });
    }
    paint(); addEventListener('resize', function () { paint(); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(paint);
    setTimeout(paint, 1500);
    if (!still) { for (var i = 0; i < 70; i++) spawn(true); requestAnimationFrame(run); }
  })();
  </script>
